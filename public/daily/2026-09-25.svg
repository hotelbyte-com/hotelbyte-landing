    <rect x="140" y="14" width="60" height="16" rx="8" fill="#C9A24B"/>
    <rect x="216" y="14" width="150" height="16" rx="8" fill="#4F7A6A"/>
    <rect x="0" y="58" width="472" height="44" rx="8" fill="#F2EEE2" stroke="#D8D1BD" stroke-width="2"/>
    <rect x="14" y="72" width="90" height="16" rx="8" fill="#7E5D19"/>
    <rect x="120" y="72" width="80" height="16" rx="8" fill="#C9A24B"/>
    <rect x="216" y="72" width="120" height="16" rx="8" fill="#4F7A6A"/>
    <rect x="0" y="116" width="472" height="44" rx="8" fill="#F2EEE2" stroke="#D8D1BD" stroke-width="2"/>
    <rect x="14" y="130" width="120" height="16" rx="8" fill="#7E5D19"/>
    <rect x="150" y="130" width="50" height="16" rx="8" fill="#C9A24B"/>
    <rect x="216" y="130" width="170" height="16" rx="8" fill="#4F7A6A"/>
  </g>
  <text x="84" y="40" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823">conditions</text>

  <circle cx="700" cy="120" r="62" fill="#C9A24B" stroke="#7E5D19" stroke-width="4"/>
  <path d="M672 112h56M672 132h36" stroke="#1C2823" stroke-width="8" stroke-linecap="round"/>
  <text x="700" y="222" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">matches</text>

