<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Smart catalogue conditions with match all or match any</title>
  <desc id="desc">A rule card with condition rows and an all-or-any switch, a live match count, hotel blocks flowing into the catalogue and an exclusion fence that always applies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2EEE2"/>
      <stop offset="1" stop-color="#F8F5EC"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <rect x="60" y="50" width="520" height="290" rx="16" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <rect x="84" y="72" width="220" height="48" rx="24" fill="#D8D1BD"/>
  <rect x="88" y="76" width="106" height="40" rx="20" fill="#1C2823"/>
