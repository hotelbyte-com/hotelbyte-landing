<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">An empty search that still offers a next step</title>
  <desc id="desc">An empty result box with three ways out: a note card, similar-price hotel cards and a contact bubble, while a failed search stays in its own grey box.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2EEE2"/>
      <stop offset="1" stop-color="#F8F5EC"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <rect x="60" y="150" width="240" height="190" rx="14" fill="#F8F5EC" stroke="#1C2823" stroke-width="3" stroke-dasharray="14 10"/>
  <circle cx="160" cy="232" r="34" fill="none" stroke="#1C2823" stroke-width="6"/>
  <path d="M184 256l30 30" stroke="#1C2823" stroke-width="8" stroke-linecap="round"/>
  <text x="180" y="384" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">no match</text>

  <g stroke="#1C2823" stroke-width="3" fill="none">
    <path d="M310 200 C360 150 400 110 450 100" marker-end="url(#arrow)"/>
    <path d="M310 245 H445" marker-end="url(#arrow)"/>
    <path d="M310 290 C360 340 400 380 450 392" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(460 60)">
    <rect width="230" height="80" rx="10" fill="#F8F5EC" stroke="#7E5D19" stroke-width="3"/>
    <rect x="18" y="20" width="150" height="14" rx="7" fill="#7E5D19"/>
    <rect x="18" y="44" width="110" height="12" rx="6" fill="#C9A24B"/>
  </g>

  <g transform="translate(460 200)">
    <rect width="76" height="96" rx="10" fill="#4F7A6A"/>
    <rect x="88" width="76" height="96" rx="10" fill="#4F7A6A"/>
    <rect x="176" width="76" height="96" rx="10" fill="#4F7A6A"/>
    <rect x="264" width="76" height="96" rx="10" fill="#4F7A6A"/>
    <rect x="352" width="76" height="96" rx="10" fill="#4F7A6A"/>
    <g fill="#F2EEE2">
      <rect x="12" y="64" width="40" height="10" rx="5"/><rect x="100" y="64" width="40" height="10" rx="5"/><rect x="188" y="64" width="40" height="10" rx="5"/>
      <rect x="276" y="64" width="40" height="10" rx="5"/><rect x="364" y="64" width="40" height="10" rx="5"/>
    </g>
  </g>
  <text x="674" y="336" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">alternatives</text>

  <g transform="translate(460 360)">
    <path d="M0 10a10 10 0 0 1 10 -10h170a10 10 0 0 1 10 10v56a10 10 0 0 1 -10 10h-120l-30 26v-26h-20a10 10 0 0 1 -10 -10z" fill="#C9A24B" stroke="#7E5D19" stroke-width="3"/>
    <circle cx="60" cy="38" r="8" fill="#1C2823"/><circle cx="95" cy="38" r="8" fill="#1C2823"/><circle cx="130" cy="38" r="8" fill="#1C2823"/>
  </g>
  <text x="680" y="412" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823">contact</text>

  <g transform="translate(80 420)" opacity="0.6">
    <rect width="200" height="70" rx="10" fill="#D8D1BD" stroke="#9C3B25" stroke-width="3"/>
    <path d="M80 18l40 34M120 18l-40 34" stroke="#9C3B25" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
