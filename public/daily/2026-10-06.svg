<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">From a saved quote to a payment link, through a live price check</title>
  <desc id="desc">A quote card with a bookmark ribbon passes a gauge for the live price and becomes a chain-link payment link; a seal with a check mark shows the quote is converted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <rect x="80" y="150" width="190" height="210" rx="14" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <path d="M220 150V218L238 204L256 218V150" fill="#D96C4F" stroke="#9C3B25" stroke-width="2"/>
  <g fill="#1C2823" opacity="0.7">
    <rect x="102" y="178" width="100" height="12" rx="6"/><rect x="102" y="232" width="146" height="10" rx="5"/>
    <rect x="102" y="256" width="120" height="10" rx="5"/><rect x="102" y="280" width="136" height="10" rx="5"/><rect x="102" y="304" width="90" height="10" rx="5"/>
  </g>
  <text x="175" y="408" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">saved quote</text>

  <path d="M270 255H352" stroke="#1C2823" stroke-width="4"/>
  <path d="M350 245L368 255L350 265z" fill="#1C2823"/>

  <path d="M390 290A90 90 0 0 1 570 290" fill="none" stroke="#D8D1BD" stroke-width="22"/>
  <path d="M390 290A90 90 0 0 1 480 200" fill="none" stroke="#4F7A6A" stroke-width="22"/>
  <path d="M480 200A90 90 0 0 1 545 227" fill="none" stroke="#C9A24B" stroke-width="22"/>
  <path d="M480 290L528 238" stroke="#1C2823" stroke-width="6" stroke-linecap="round"/>
  <circle cx="480" cy="290" r="12" fill="#1C2823"/>
  <rect x="400" y="300" width="160" height="40" rx="10" fill="#1C2823"/>
  <rect x="420" y="314" width="80" height="12" rx="6" fill="#C9A24B"/>
  <circle cx="530" cy="320" r="7" fill="#D96C4F"/>
  <text x="480" y="408" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">live price</text>

  <path d="M586 255H636" stroke="#1C2823" stroke-width="4"/>
  <path d="M634 245L652 255L634 265z" fill="#1C2823"/>

  <g fill="none" stroke="#7E5D19" stroke-width="12">
    <rect x="668" y="226" width="110" height="58" rx="29" transform="rotate(-18 723 255)"/>
    <rect x="742" y="226" width="110" height="58" rx="29" transform="rotate(-18 797 255)"/>
  </g>
  <circle cx="840" cy="150" r="36" fill="#F8F5EC" stroke="#9C3B25" stroke-width="5"/>
  <path d="M822 150L835 164L860 136" fill="none" stroke="#9C3B25" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="768" y="408" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">payment link</text>
</svg>
