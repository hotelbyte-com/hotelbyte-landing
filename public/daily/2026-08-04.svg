<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Inventory release-time clock for group and transient rooms</title>
  <desc id="desc">An editorial inventory clock shows a Thursday calendar cell, 16:00 release hand, group allotment block, transient inventory rail, revenue demand curve, rate-plan tag, guaranteed-room-night seal, auto-release gate, timezone ring, and approval pins.</desc>
  <defs>
    <radialGradient id="dawnBoard" cx="50%" cy="42%" r="76%">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.48" stop-color="#d8e7df"/>
      <stop offset="1" stop-color="#263a48"/>
    </radialGradient>
    <linearGradient id="calendarPaper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset="1" stop-color="#dce8d7"/>
    </linearGradient>
    <linearGradient id="inkPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#23394a"/>
      <stop offset="1" stop-color="#101b27"/>
    </linearGradient>
    <linearGradient id="groupBlock" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#d6973f"/>
    </linearGradient>
    <linearGradient id="transientRail" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d6f2e8"/>
      <stop offset="1" stop-color="#4ea083"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f68a73"/>
      <stop offset="1" stop-color="#b94a54"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c9e8ff"/>
      <stop offset="1" stop-color="#4e82b5"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cbc0ff"/>
      <stop offset="1" stop-color="#625aa0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#182935" flood-opacity=".25"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#dawnBoard)"/>
  <g opacity=".18" stroke="#ffffff" stroke-width="2">
    <path d="M86 82h788M86 134h788M86 186h788M86 238h788M86 290h788M86 342h788M86 394h788M86 446h788"/>
    <path d="M124 66v416M206 66v416M288 66v416M370 66v416M452 66v416M534 66v416M616 66v416M698 66v416M780 66v416M862 66v416"/>
  </g>
  <circle cx="494" cy="274" r="212" fill="#fff8e4" opacity=".18" filter="url(#soft)"/>
  <path d="M80 76h800M112 118h690M84 464h790" stroke="#fff8e6" stroke-width="8" stroke-linecap="round" opacity=".48"/>

  <g transform="translate(92 88)" filter="url(#shadow)">
    <rect width="286" height="338" rx="30" fill="url(#calendarPaper)"/>
    <rect width="286" height="62" rx="30" fill="url(#inkPanel)"/>
    <path d="M34 32h74M132 32h44M202 32h38" stroke="#ffe28a" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(32 92)">
      <rect width="222" height="196" rx="24" fill="#eef6ee"/>
      <path d="M0 56h222M0 112h222M0 168h222M56 0v196M112 0v196M168 0v196" stroke="#aebeb9" stroke-width="4" opacity=".7"/>
      <rect x="58" y="58" width="108" height="108" rx="20" fill="#fff6cf"/>
      <path d="M80 84h62M80 118h44M80 150h70" stroke="#50625d" stroke-width="8" stroke-linecap="round"/>
      <text x="74" y="42" fill="#22394a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">THU</text>
    </g>
    <text x="32" y="318" fill="#334b58" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">availability calendar</text>
  </g>

  <g transform="translate(334 52)" filter="url(#shadow)">
    <circle cx="210" cy="210" r="190" fill="#f7fbf0"/>
    <circle cx="210" cy="210" r="162" fill="#dfece5"/>
    <circle cx="210" cy="210" r="124" fill="#fdf7df"/>
    <path d="M210 44v40M210 336v40M44 210h40M336 210h40" stroke="#284152" stroke-width="9" stroke-linecap="round"/>
    <path d="M130 68l20 34M290 68l-20 34M130 352l20-34M290 352l-20-34" stroke="#5f7276" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <path d="M210 210l104-104" stroke="url(#coral)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="210" cy="210" r="18" fill="#23394a"/>
    <circle cx="314" cy="106" r="24" fill="url(#coral)"/>
    <path d="M298 106h32" stroke="#fff8e6" stroke-width="7" stroke-linecap="round"/>
    <text x="172" y="126" fill="#263b48" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900">16:00</text>
    <text x="140" y="304" fill="#3a5059" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">release time</text>

    <path d="M86 238c42-24 82-28 122-10 44 20 86 16 126-18" fill="none" stroke="url(#blue)" stroke-width="10" stroke-linecap="round"/>
    <path d="M88 270c50-22 100-20 150 6 34 18 66 18 100-2" fill="none" stroke="#9fb3bd" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 15"/>
  </g>

  <g transform="translate(102 334)" filter="url(#shadow)">
    <rect width="288" height="90" rx="26" fill="url(#groupBlock)"/>
    <path d="M28 32h84M28 58h126" stroke="#5b3b1d" stroke-width="8" stroke-linecap="round"/>
    <circle cx="224" cy="45" r="22" fill="#fff8df"/>
    <path d="M212 45h24M224 33v24" stroke="#9a6224" stroke-width="7" stroke-linecap="round"/>
    <text x="18" y="124" fill="#f8f0db" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">group allotment block</text>
  </g>

  <g transform="translate(616 86)" filter="url(#shadow)">
    <rect width="242" height="90" rx="26" fill="url(#transientRail)"/>
    <path d="M30 45h142" stroke="#1f5e4f" stroke-width="12" stroke-linecap="round"/>
    <path d="M160 26l36 19-36 19" fill="none" stroke="#1f5e4f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="10" y="124" fill="#334b58" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">transient inventory rail</text>
  </g>

  <g transform="translate(664 208)" filter="url(#shadow)">
    <rect width="190" height="126" rx="28" fill="#fffdf1"/>
    <rect x="24" y="24" width="78" height="34" rx="14" fill="url(#violet)"/>
    <path d="M34 42h48" stroke="#fff8e6" stroke-width="7" stroke-linecap="round"/>
    <path d="M26 82h92M26 106h126" stroke="#556760" stroke-width="7" stroke-linecap="round"/>
    <text x="4" y="164" fill="#334b58" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">rate plan tag</text>
  </g>

  <g transform="translate(676 360)" filter="url(#shadow)">
    <path d="M0 0h158c22 0 40 18 40 40v50c0 22-18 40-40 40H0z" fill="url(#inkPanel)"/>
    <rect x="28" y="28" width="54" height="54" rx="18" fill="url(#groupBlock)"/>
    <path d="M98 42h62M98 70h40M98 98h72" stroke="#dcece4" stroke-width="7" stroke-linecap="round"/>
    <path d="M46 54l12 14 28-34" fill="none" stroke="#5b3b1d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-18" y="166" fill="#f8f0db" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">guaranteed nights seal</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M388 378C470 372 540 330 612 186" stroke="#d6973f" stroke-width="9"/>
    <path d="M594 162C636 144 654 132 684 130" stroke="#4ea083" stroke-width="9"/>
    <path d="M546 300C626 316 660 342 706 388" stroke="#625aa0" stroke-width="8"/>
    <path d="M378 198C430 178 482 158 544 154" stroke="#4e82b5" stroke-width="8" stroke-dasharray="14 14"/>
  </g>

  <g transform="translate(436 418)" filter="url(#shadow)">
    <rect width="162" height="58" rx="24" fill="url(#coral)"/>
    <path d="M28 30h76" stroke="#fff8e6" stroke-width="8" stroke-linecap="round"/>
    <circle cx="124" cy="29" r="13" fill="#fff8e6"/>
    <text x="6" y="92" fill="#f8f0db" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">auto-release gate</text>
  </g>

  <g transform="translate(784 184)" filter="url(#shadow)">
    <circle cx="46" cy="46" r="42" fill="url(#blue)"/>
    <path d="M46 18v28l20 16" stroke="#17344a" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 46h10M62 46h10" stroke="#17344a" stroke-width="7" stroke-linecap="round"/>
    <text x="-10" y="118" fill="#334b58" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">timezone ring</text>
  </g>

  <g transform="translate(282 112)" filter="url(#shadow)">
    <circle cx="28" cy="28" r="22" fill="#fffdf1"/>
    <path d="M18 28h20M28 18v20" stroke="#b94a54" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 50v44" stroke="#b94a54" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(614 330)" filter="url(#shadow)">
    <circle cx="28" cy="28" r="22" fill="#fffdf1"/>
    <path d="M18 28h20M28 18v20" stroke="#4e82b5" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 50v44" stroke="#4e82b5" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
