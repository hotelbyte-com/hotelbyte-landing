    <rect x="10" y="12" width="88" height="28" rx="12" fill="url(#mint)" />
    <text x="24" y="31" fill="#104a52" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">open</text>
    <rect x="10" y="48" width="88" height="28" rx="12" fill="url(#amber)" />
    <text x="22" y="66" fill="#fff4eb" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">hold</text>
