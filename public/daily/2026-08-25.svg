  <path d="M462 246C500 246 500 188 540 188" fill="none" stroke="#4ea9ab" stroke-width="7" stroke-linecap="round" />
  <path d="M462 300C500 300 500 360 540 360" fill="none" stroke="#d16a51" stroke-width="7" stroke-linecap="round" />
  <path d="M848 248C878 248 900 248 920 248" fill="none" stroke="#785ec2" stroke-width="6" stroke-linecap="round" />
  <path d="M474 250C492 250 492 246 510 246" fill="none" stroke="#c5d8ef" stroke-width="8" />

