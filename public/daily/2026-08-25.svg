  <g transform="translate(628 444)" filter="url(#shadow)">
    <rect width="258" height="76" rx="18" fill="#ecf5f4" />
    <path d="M24 38H102" stroke="#7ea6ab" stroke-width="8" stroke-linecap="round" />
    <circle cx="120" cy="38" r="12" fill="url(#mint)" />
    <path d="M132 34h56" stroke="#375f65" stroke-width="8" stroke-linecap="round" />
    <circle cx="196" cy="38" r="12" fill="url(#amber)" />
