    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0c192a" flood-opacity="0.24" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)" />
  <path d="M0 82h960M0 164h960M0 246h960M0 328h960M0 410h960" stroke="#d8e6f2" stroke-width="2" opacity="0.28" />
  <path d="M106 0v540M234 0v540M362 0v540M490 0v540M618 0v540M746 0v540M874 0v540" stroke="#d8e6f2" stroke-width="1.5" opacity="0.16" />

