<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Reconciliation status keeps variance closeable</title>
  <desc id="desc">An editorial settlement scene with a discrepancy ledger, pending confirmation card, supplier evidence chain, close deadline dial, escalation gate, and amount comparison lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff" />
      <stop offset="1" stop-color="#1f3449" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4" />
      <stop offset="1" stop-color="#dfe7f4" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233a57" />
      <stop offset="1" stop-color="#0f1d30" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dfd3" />
      <stop offset="1" stop-color="#4ea9ab" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8c98b" />
      <stop offset="1" stop-color="#d16a51" />
