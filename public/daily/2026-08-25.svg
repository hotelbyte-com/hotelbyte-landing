    <path d="M276 78h58" stroke="#8fa0b2" stroke-width="6" stroke-linecap="round" />
    <path d="M276 90h58" stroke="#8fa0b2" stroke-width="6" stroke-linecap="round" />
    <path d="M276 114h58" stroke="#8fa0b2" stroke-width="6" stroke-linecap="round" />
  </g>

