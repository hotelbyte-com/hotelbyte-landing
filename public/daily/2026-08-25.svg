    <text x="38" y="222" fill="#263d57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">reason: pricing_override</text>
    <text x="38" y="242" fill="#263d57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">amount: +3,420.00 AED</text>
