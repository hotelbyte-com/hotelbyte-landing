    <rect x="16" y="40" width="108" height="16" rx="8" fill="#d7e4ef" />
    <rect x="16" y="62" width="108" height="16" rx="8" fill="#ddebf9" />
    <rect x="16" y="84" width="108" height="10" rx="5" fill="#4ea9ab" />
    <path d="M124 40V22" stroke="#785ec2" stroke-width="6" />
