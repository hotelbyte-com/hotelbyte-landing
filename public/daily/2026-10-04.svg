<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">An email form that opens a sandbox by itself</title>
  <desc id="desc">An envelope moves into a door that opens on its own; behind it a sandbox account card links to supplier lines, and three small dots above the envelope stand for submitting, success and failure.</desc>
