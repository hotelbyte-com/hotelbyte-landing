<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title>Invoice ledger audit for HotelByte daily story</title>
  <desc>Editorial composition of a distribution invoice row, settlement clock, allocation path, and evidence stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7ff"/>
      <stop offset="100%" stop-color="#e8f2e8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f355033"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="url(#bg)"/>

  <rect x="64" y="56" width="832" height="428" rx="22" fill="#ffffff" stroke="#0f2b4e" stroke-opacity="0.12"/>
  <line x1="64" y1="152" x2="896" y2="152" stroke="#1d3e7a" stroke-opacity="0.22"/>

  <g transform="translate(110,190)" filter="url(#soft)">
    <rect x="0" y="0" width="280" height="198" rx="16" fill="#fff4d9" stroke="#d9a64d" stroke-width="2"/>
    <rect x="18" y="18" width="244" height="22" rx="10" fill="#ffe7a8"/>
    <rect x="18" y="52" width="244" height="14" rx="7" fill="#f5d8a8"/>
    <rect x="18" y="78" width="244" height="14" rx="7" fill="#f5d8a8"/>
    <rect x="18" y="104" width="244" height="14" rx="7" fill="#f5d8a8"/>
    <rect x="18" y="132" width="164" height="18" rx="9" fill="#f7c56b"/>
    <circle cx="244" cy="171" r="13" fill="#1f4679"/>
    <text x="244" y="176" fill="#f4f7ff" font-size="14" text-anchor="middle" font-family="Trebuchet MS, Arial">row</text>
    <text x="140" y="20" fill="#59380d" font-size="14" font-family="Trebuchet MS, Arial">invoice_line_id</text>
  </g>

  <g transform="translate(430,190)">
    <rect x="0" y="0" width="240" height="96" rx="12" fill="#dff0ff" stroke="#5c87c6" stroke-width="2"/>
    <circle cx="40" cy="48" r="24" fill="#7ec3ff"/>
    <rect x="70" y="16" width="150" height="12" rx="6" fill="#8ab6df"/>
    <rect x="70" y="38" width="150" height="12" rx="6" fill="#8ab6df"/>
    <rect x="70" y="60" width="150" height="12" rx="6" fill="#8ab6df"/>
    <circle cx="44" cy="148" r="16" fill="#2a5f3a"/>
    <line x1="44" y1="64" x2="44" y2="132" stroke="#2a5f3a" stroke-width="4"/>
    <line x1="44" y1="132" x2="138" y2="132" stroke="#2a5f3a" stroke-width="4"/>
    <text x="22" y="26" fill="#1f3550" font-size="13" font-family="Trebuchet MS, Arial">snapshot</text>
    <text x="22" y="154" fill="#eaf6ed" font-size="13" font-family="Trebuchet MS, Arial">clock</text>
  </g>

  <g transform="translate(430,320)">
    <rect x="0" y="0" width="400" height="70" rx="12" fill="#f6d5d5" stroke="#d46f6f" stroke-width="2"/>
    <rect x="20" y="18" width="120" height="12" rx="6" fill="#e79b9b"/>
    <rect x="150" y="18" width="120" height="12" rx="6" fill="#e79b9b"/>
    <rect x="280" y="18" width="86" height="12" rx="6" fill="#e79b9b"/>
    <path d="M 60 40 Q 120 10, 180 40 T 300 40 T 380 40" fill="none" stroke="#9d2f2f" stroke-width="4"/>
    <circle cx="80" cy="40" r="7" fill="#7f1b1b"/>
    <circle cx="200" cy="40" r="7" fill="#7f1b1b"/>
    <circle cx="320" cy="40" r="7" fill="#7f1b1b"/>
    <text x="24" y="31" fill="#6e2626" font-size="12" font-family="Trebuchet MS, Arial">allocation lane</text>
  </g>

  <g transform="translate(790,220)">
    <rect x="-16" y="-6" width="130" height="120" rx="12" fill="#e9f0ff" stroke="#7b94c9" stroke-width="2"/>
    <rect x="12" y="12" width="84" height="16" rx="8" fill="#c9ddff"/>
    <rect x="12" y="34" width="84" height="16" rx="8" fill="#c9ddff"/>
    <rect x="12" y="56" width="84" height="16" rx="8" fill="#c9ddff"/>
    <circle cx="54" cy="92" r="14" fill="#365b8f"/>
    <text x="54" y="97" text-anchor="middle" fill="#eaf3ff" font-size="11" font-family="Trebuchet MS, Arial">seal</text>
  </g>

  <g transform="translate(280,330)">
    <rect x="0" y="-4" width="20" height="120" rx="10" fill="#1e5f7f"/>
    <rect x="26" y="18" width="170" height="58" rx="10" fill="#f6f6f6" stroke="#1e5f7f" stroke-width="2"/>
    <rect x="46" y="34" width="130" height="12" rx="6" fill="#daeaf8"/>
    <text x="40" y="12" fill="#12314d" font-size="12" font-family="Trebuchet MS, Arial">distribution evidence</text>
  </g>

  <circle cx="220" cy="90" r="10" fill="#d5a24a"/>
  <circle cx="500" cy="92" r="10" fill="#3b79d3"/>
  <circle cx="790" cy="94" r="10" fill="#a84f4f"/>
  <circle cx="250" cy="445" r="10" fill="#3f7f55"/>

  <text x="480" y="508" text-anchor="middle" fill="#2a3c5f" font-size="18" font-family="Trebuchet MS, Arial" opacity="0.75">Distribution evidence is a shared boundary, not a late apology.</text>
</svg>
