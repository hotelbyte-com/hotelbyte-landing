<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A set price above the floor sells; one below it is dropped</title>
  <desc id="desc">An upright price ruler with a red floor bar, an accepted price tag above the floor and a rejected tag falling into a bin below it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <rect x="150" y="60" width="70" height="420" rx="10" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <g stroke="#1C2823" stroke-width="3" stroke-linecap="round">
    <path d="M150 100h26"/><path d="M150 140h16"/><path d="M150 180h26"/><path d="M150 220h16"/>
    <path d="M150 260h26"/><path d="M150 300h16"/><path d="M150 340h26"/><path d="M150 380h16"/>
    <path d="M150 420h26"/><path d="M150 460h16"/>
  </g>

  <rect x="120" y="322" width="680" height="22" rx="6" fill="#9C3B25"/>
  <text x="240" y="384" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#9C3B25">net price floor</text>

  <g transform="translate(330 150)">
    <path d="M0 0h190l40 40l-40 40h-190z" fill="#C9A24B" stroke="#7E5D19" stroke-width="3"/>
    <circle cx="186" cy="40" r="9" fill="#F8F5EC" stroke="#7E5D19" stroke-width="3"/>
    <rect x="22" y="22" width="120" height="14" rx="7" fill="#7E5D19"/>
    <rect x="22" y="46" width="80" height="12" rx="6" fill="#7E5D19" opacity="0.6"/>
  </g>
  <circle cx="620" cy="190" r="34" fill="#4F7A6A"/>
  <path d="M604 190l12 12l22 -24" fill="none" stroke="#F8F5EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="128" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823">your price</text>

  <g transform="translate(560 400) rotate(18)">
    <path d="M0 0h150l32 32l-32 32h-150z" fill="#D96C4F" stroke="#9C3B25" stroke-width="3" opacity="0.85"/>
    <rect x="18" y="18" width="96" height="12" rx="6" fill="#9C3B25"/>
  </g>
  <path d="M520 360 C540 380 560 392 580 398" fill="none" stroke="#9C3B25" stroke-width="3" stroke-dasharray="8 8"/>

  <path d="M760 400h120l-14 90h-92z" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <path d="M752 400h136" stroke="#1C2823" stroke-width="5" stroke-linecap="round"/>
  <path d="M800 420v52M820 420v52M840 420v52" stroke="#D8D1BD" stroke-width="4"/>
  <text x="820" y="378" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">dropped</text>
</svg>
