    <text x="14" y="22" fill="#0c4447" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">TIME CHECK</text>
    <text x="14" y="44" fill="#0c4447" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">effective_window</text>
    <text x="14" y="60" fill="#0c4447" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">split risk clocked</text>
