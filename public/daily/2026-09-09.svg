      <stop offset="100%" stop-color="#d95f67"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0d253f" flood-opacity="0.28"/>
    </filter>
  </defs>

