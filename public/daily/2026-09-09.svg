    <text x="44" y="350" fill="#ffdca2" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800">effective_window: 2026-09-09</text>
    <text x="44" y="366" fill="#ffdca2" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">to 2026-09-10 02:00</text>
