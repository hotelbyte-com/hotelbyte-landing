    <text x="14" y="22" fill="#f8f3ff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">RECONCILIATION</text>
    <text x="14" y="44" fill="#f8f3ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">chargeable vs displayed</text>
    <text x="14" y="60" fill="#f8f3ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">match by version</text>
  </g>

