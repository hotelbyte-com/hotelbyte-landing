<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rate-sheet precedence keeps distribution promises consistent</title>
  <desc id="desc">An editorial map of rate-sheet rows, precedence cascade, channel gates, time boundary, and settlement evidence tray, showing how one inheritance order changes an offer across markets.</desc>

  <defs>
