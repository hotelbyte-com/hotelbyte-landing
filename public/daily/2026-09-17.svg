<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">The same own ID always yields the same catalogue key</title>
  <desc id="desc">A solid sheet row and a dashed repeat of it, each carrying only the customer’s own ID, flow through one key into a single highlighted catalogue row.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EEE2"/>
      <stop offset="1" stop-color="#F8F5EC"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <text x="64" y="132" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823">own ID</text>
  <rect x="60" y="150" width="300" height="64" rx="12" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <rect x="74" y="162" width="92" height="40" rx="8" fill="#C9A24B" stroke="#7E5D19" stroke-width="2"/>
  <g fill="#D8D1BD"><rect x="180" y="170" width="76" height="12" rx="6"/><rect x="180" y="188" width="52" height="8" rx="4"/><rect x="270" y="172" width="74" height="12" rx="6"/></g>

  <rect x="60" y="330" width="300" height="64" rx="12" fill="none" stroke="#7E5D19" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="74" y="342" width="92" height="40" rx="8" fill="#C9A24B" opacity="0.6"/>
  <g fill="#D8D1BD" opacity="0.8"><rect x="180" y="350" width="76" height="12" rx="6"/><rect x="180" y="368" width="52" height="8" rx="4"/><rect x="270" y="352" width="74" height="12" rx="6"/></g>
  <text x="64" y="440" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#7E5D19">import again</text>

  <g stroke="#1C2823" stroke-width="4" fill="none" marker-end="url(#tip)">
    <path d="M368 182 C420 182 400 248 410 258"/>
    <path d="M368 362 C420 362 400 296 410 286"/>
  </g>

  <circle cx="462" cy="272" r="44" fill="none" stroke="#7E5D19" stroke-width="14"/>
  <rect x="504" y="263" width="104" height="18" rx="6" fill="#7E5D19"/>
  <rect x="566" y="279" width="14" height="26" rx="3" fill="#7E5D19"/>
  <rect x="590" y="279" width="14" height="34" rx="3" fill="#7E5D19"/>
  <text x="520" y="368" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">same key</text>

  <path d="M618 272 H668" stroke="#1C2823" stroke-width="4" fill="none" marker-end="url(#tip)"/>

  <rect x="684" y="104" width="220" height="336" rx="14" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <g fill="#D8D1BD">
    <rect x="704" y="128" width="180" height="40" rx="8"/>
    <rect x="704" y="184" width="180" height="40" rx="8"/>
    <rect x="704" y="320" width="180" height="40" rx="8"/>
    <rect x="704" y="376" width="180" height="40" rx="8"/>
  </g>
  <rect x="698" y="246" width="192" height="52" rx="10" fill="#4F7A6A"/>
  <rect x="712" y="258" width="64" height="28" rx="6" fill="#C9A24B"/>
  <rect x="788" y="266" width="86" height="12" rx="6" fill="#F2EEE2"/>
  <text x="794" y="484" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">one row</text>
</svg>
