  <path d="M775 305 L885 195" stroke="#D96C4F" stroke-width="8" stroke-linecap="round"/>
  <text x="830" y="390" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">no secrets</text>
