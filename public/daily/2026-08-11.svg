<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rate plan override mark blocking an old inherited policy</title>
  <desc id="desc">An editorial rate-plan inheritance map shows a parent plan trunk, child-plan branches, a red override mark, cancellation-policy column, breakfast-rule tag, payment-terms clip, stay-date rail, approval stamp, audit-time pin, and an old policy note blocked before it flows into a new price.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef6f4"/>
      <stop offset=".48" stop-color="#cfdfe2"/>
      <stop offset="1" stop-color="#283447"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#dbe5d9"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22344a"/>
      <stop offset="1" stop-color="#101927"/>
    </linearGradient>
    <linearGradient id="parent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d39134"/>
    </linearGradient>
    <linearGradient id="child" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d5f1e7"/>
      <stop offset="1" stop-color="#4b9b83"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f37d70"/>
      <stop offset="1" stop-color="#b64250"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cceaff"/>
      <stop offset="1" stop-color="#4f83bd"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cbc3ff"/>
      <stop offset="1" stop-color="#6758a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#172536" flood-opacity=".24"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#canvas)"/>
  <g opacity=".2" stroke="#ffffff" stroke-width="2">
    <path d="M82 78h792M82 126h792M82 174h792M82 222h792M82 270h792M82 318h792M82 366h792M82 414h792"/>
    <path d="M126 58v404M210 58v404M294 58v404M378 58v404M462 58v404M546 58v404M630 58v404M714 58v404M798 58v404"/>
  </g>
  <ellipse cx="506" cy="298" rx="402" ry="176" fill="#fff8dc" opacity=".16" filter="url(#glow)"/>
  <path d="M78 74h804M116 116h684M82 462h794" stroke="#fff8e6" stroke-width="8" stroke-linecap="round" opacity=".48"/>

  <g transform="translate(82 78)" filter="url(#shadow)">
    <rect width="268" height="360" rx="30" fill="url(#paper)"/>
    <rect x="28" y="28" width="184" height="48" rx="18" fill="url(#ink)"/>
    <text x="48" y="59" fill="#ffe08a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900">parent plan</text>
    <path d="M50 120h150M50 160h118M50 200h144M50 240h104" stroke="#566660" stroke-width="9" stroke-linecap="round"/>
    <rect x="44" y="282" width="176" height="46" rx="18" fill="url(#parent)"/>
    <path d="M68 306h108" stroke="#503818" stroke-width="8" stroke-linecap="round"/>
    <text x="32" y="402" fill="#f8f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">source rule bundle</text>
  </g>

  <g transform="translate(394 78)" filter="url(#shadow)">
    <rect width="440" height="276" rx="32" fill="#f9fcf3"/>
    <rect x="28" y="28" width="384" height="54" rx="18" fill="#25384d"/>
    <path d="M54 55h102M188 55h78M306 55h70" stroke="#d5f1e7" stroke-width="8" stroke-linecap="round"/>
    <path d="M62 118h306M62 168h306M62 218h306" stroke="#98aaa6" stroke-width="8" stroke-linecap="round"/>
    <path d="M164 96v142M282 96v142" stroke="#c3d0ca" stroke-width="6" stroke-linecap="round"/>
    <rect x="50" y="101" width="92" height="34" rx="14" fill="url(#child)"/>
    <rect x="50" y="151" width="92" height="34" rx="14" fill="url(#child)"/>
    <rect x="50" y="201" width="92" height="34" rx="14" fill="url(#child)"/>
    <path d="M72 118h48M72 168h48M72 218h48" stroke="#214c42" stroke-width="7" stroke-linecap="round"/>
    <rect x="186" y="101" width="78" height="34" rx="14" fill="url(#blue)"/>
    <rect x="186" y="151" width="78" height="34" rx="14" fill="#dfe7e4"/>
    <rect x="186" y="201" width="78" height="34" rx="14" fill="url(#blue)"/>
    <path d="M204 118h42M204 168h30M204 218h42" stroke="#26384b" stroke-width="7" stroke-linecap="round"/>
    <rect x="304" y="151" width="72" height="34" rx="14" fill="url(#coral)"/>
    <path d="M322 168h36" stroke="#fff8e6" stroke-width="7" stroke-linecap="round"/>
    <text x="14" y="316" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">inheritance table with one override point</text>
  </g>

  <g transform="translate(326 104)">
    <path d="M0 178C60 144 92 108 146 74" fill="none" stroke="#d39134" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 212C74 208 100 204 146 166" fill="none" stroke="#4b9b83" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 14"/>
    <path d="M0 246C68 274 112 260 146 214" fill="none" stroke="#4f83bd" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 16"/>
  </g>

  <g transform="translate(664 214)" filter="url(#shadow)">
    <circle cx="52" cy="52" r="46" fill="url(#coral)"/>
    <circle cx="52" cy="52" r="26" fill="#fff8e6"/>
    <path d="M38 52h28M52 38v28" stroke="#b64250" stroke-width="8" stroke-linecap="round"/>
    <path d="M86 26c40-18 72-14 96 10" fill="none" stroke="#b64250" stroke-width="9" stroke-linecap="round"/>
    <text x="-16" y="124" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">override mark</text>
  </g>

  <g transform="translate(718 66) rotate(3)" filter="url(#shadow)">
    <rect width="154" height="108" rx="24" fill="url(#violet)"/>
    <path d="M28 36h84M28 64h104M28 88h58" stroke="#fff8e6" stroke-width="8" stroke-linecap="round"/>
    <text x="-22" y="148" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">cancellation policy</text>
  </g>

  <g transform="translate(118 432)" filter="url(#shadow)">
    <rect width="184" height="62" rx="24" fill="url(#blue)"/>
    <path d="M30 32h100" stroke="#1c3650" stroke-width="8" stroke-linecap="round"/>
    <circle cx="146" cy="31" r="14" fill="#fff8e6"/>
    <text x="-2" y="98" fill="#f8f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">stay-date rail</text>
  </g>

  <g transform="translate(360 406)" filter="url(#shadow)">
    <rect width="154" height="76" rx="24" fill="#fffaf0"/>
    <rect x="28" y="24" width="70" height="30" rx="13" fill="url(#parent)"/>
    <path d="M30 60h94" stroke="#5a625e" stroke-width="7" stroke-linecap="round"/>
    <text x="-8" y="112" fill="#f8f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">breakfast tag</text>
  </g>

  <g transform="translate(560 400)" filter="url(#shadow)">
    <rect width="168" height="78" rx="24" fill="url(#ink)"/>
    <path d="M28 32h104M28 56h66" stroke="#dbe5d9" stroke-width="8" stroke-linecap="round"/>
    <path d="M128 20v38" stroke="#f37d70" stroke-width="8" stroke-linecap="round"/>
    <text x="-6" y="114" fill="#f8f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">payment terms clip</text>
  </g>

  <g transform="translate(758 374)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="44" fill="#fffaf0"/>
    <circle cx="50" cy="50" r="29" fill="none" stroke="url(#child)" stroke-width="10"/>
    <path d="M34 50h32M50 34v32" stroke="#2b6a56" stroke-width="7" stroke-linecap="round"/>
    <text x="-10" y="122" fill="#f8f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">approval stamp</text>
  </g>

  <g transform="translate(250 46)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="24" fill="#fffaf0"/>
    <path d="M30 14v16l14 9" stroke="#25384d" stroke-width="7" stroke-linecap="round"/>
    <path d="M30 54v54" stroke="#6758a4" stroke-width="7" stroke-linecap="round"/>
    <circle cx="30" cy="108" r="9" fill="#6758a4"/>
    <text x="-24" y="148" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">audit-time pin</text>
  </g>

  <g transform="translate(690 286) rotate(-4)" filter="url(#shadow)">
    <rect width="166" height="80" rx="22" fill="#f3dfc5"/>
    <path d="M28 30h104M28 54h70" stroke="#745d42" stroke-width="8" stroke-linecap="round"/>
    <path d="M-18 40h202" stroke="url(#coral)" stroke-width="14" stroke-linecap="round" opacity=".82"/>
    <text x="-12" y="116" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">old policy stopped</text>
  </g>
</svg>
