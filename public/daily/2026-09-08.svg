<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Cancellation policy as a reviewable object</title>
  <desc id="desc">An editorial scene showing one cancellation-policy object with version, timezone, and currency fields connected to channel promises and settlement evidence.</desc>

