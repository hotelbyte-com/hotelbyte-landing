<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A saved search reopened with its conditions, then re-checked</title>
  <desc id="desc">A bookmarked record card with two beds, guests, a flag and a coin above a crossed-out old price tag; a circular re-check arrow; a refreshed price card and a checkout button.</desc>
