    <circle cx="212" cy="158" r="11"/><circle cx="240" cy="158" r="11"/>
    <circle cx="212" cy="214" r="11"/><circle cx="236" cy="218" r="7"/>
  </g>
  <path d="M124 252 V296" stroke="#1C2823" stroke-width="3"/>
