<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A bulk job that keeps running after the tab closes</title>
  <desc id="desc">A closed browser window, a whole spreadsheet file moving into a server job queue, and a progress bar, cancel button and outcome log beside the queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <g transform="translate(50 120)" opacity="0.55">
    <rect width="220" height="170" rx="12" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
    <path d="M0 36h220" stroke="#1C2823" stroke-width="3"/>
    <circle cx="20" cy="18" r="6" fill="#D96C4F"/><circle cx="40" cy="18" r="6" fill="#C9A24B"/><circle cx="60" cy="18" r="6" fill="#4F7A6A"/>
    <path d="M70 70l80 80M150 70l-80 80" stroke="#9C3B25" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="160" y="340" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">tab closed</text>

  <g transform="translate(300 160)">
    <path d="M0 0h80l30 30v110h-110z" fill="#F8F5EC" stroke="#7E5D19" stroke-width="3"/>
    <path d="M80 0v30h30" fill="none" stroke="#7E5D19" stroke-width="3"/>
    <path d="M16 56h78M16 76h78M16 96h78M16 116h78M44 44v86M72 44v86" stroke="#C9A24B" stroke-width="3"/>
  </g>
  <path d="M420 230h80" stroke="#1C2823" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(520 80)">
    <rect width="190" height="300" rx="14" fill="#1C2823"/>
    <g fill="#F2EEE2">
      <rect x="20" y="24" width="150" height="44" rx="8"/><rect x="20" y="84" width="150" height="44" rx="8"/>
      <rect x="20" y="144" width="150" height="44" rx="8"/><rect x="20" y="204" width="150" height="44" rx="8"/>
    </g>
    <g fill="#7E5D19">
      <rect x="34" y="40" width="70" height="12" rx="6"/><rect x="34" y="100" width="90" height="12" rx="6"/>
      <rect x="34" y="160" width="60" height="12" rx="6"/><rect x="34" y="220" width="80" height="12" rx="6"/>
    </g>
    <circle cx="150" cy="46" r="10" fill="#4F7A6A"/><circle cx="150" cy="106" r="10" fill="#4F7A6A"/>
  </g>
  <text x="615" y="430" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">job queue</text>

  <g transform="translate(740 100)">
    <rect width="180" height="26" rx="13" fill="#D8D1BD"/>
    <rect width="112" height="26" rx="13" fill="#4F7A6A"/>
    <rect x="0" y="60" width="120" height="44" rx="10" fill="#F8F5EC" stroke="#9C3B25" stroke-width="3"/>
    <path d="M44 72l32 20M76 72l-32 20" stroke="#9C3B25" stroke-width="5" stroke-linecap="round"/>
    <rect x="0" y="140" width="180" height="140" rx="10" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
    <path d="M20 174h20M52 174h108M20 210h20M52 210h88M20 246h20M52 246h100" stroke="#7E5D19" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="830" y="430" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">status</text>
</svg>
