<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Member accounts kept inside the company domain</title>
  <desc id="desc">A walled courtyard labelled company domain holds member cards; a dashed placeholder card is replaced by a solid card for the real owner, while an outside envelope is stopped at the gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7E5D19"/>
    </marker>
    <g id="person">
      <circle cx="0" cy="-12" r="14" fill="#1C2823"/>
      <path d="M-22 22 Q-22 4 0 4 Q22 4 22 22 Z" fill="#1C2823"/>
    </g>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <path d="M640 222 V108 Q640 92 624 92 H86 Q70 92 70 108 V444 Q70 460 86 460 H624 Q640 460 640 444 V326" fill="none" stroke="#1C2823" stroke-width="12" stroke-linecap="round"/>
  <rect x="628" y="204" width="26" height="22" rx="4" fill="#7E5D19"/>
  <rect x="628" y="322" width="26" height="22" rx="4" fill="#7E5D19"/>
  <text x="355" y="70" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">company domain</text>

  <g stroke="#1C2823" stroke-width="2" fill="#F8F5EC">
    <rect x="110" y="134" width="200" height="104" rx="12"/>
    <rect x="110" y="300" width="200" height="104" rx="12"/>
  </g>
  <use href="#person" x="150" y="186"/><use href="#person" x="150" y="352"/>
  <g fill="#D8D1BD">
    <rect x="186" y="170" width="104" height="12" rx="6"/><rect x="186" y="194" width="76" height="10" rx="5"/>
    <rect x="186" y="336" width="104" height="12" rx="6"/><rect x="186" y="360" width="76" height="10" rx="5"/>
  </g>

  <rect x="370" y="134" width="210" height="104" rx="12" fill="none" stroke="#7E5D19" stroke-width="3" stroke-dasharray="9 7"/>
  <circle cx="412" cy="174" r="14" fill="none" stroke="#7E5D19" stroke-width="3" stroke-dasharray="5 4"/>
  <rect x="446" y="170" width="104" height="12" rx="6" fill="#D8D1BD" opacity="0.7"/>
  <path d="M475 246 V286" stroke="#7E5D19" stroke-width="5" marker-end="url(#tip)"/>
  <rect x="370" y="300" width="210" height="104" rx="12" fill="#F8F5EC" stroke="#7E5D19" stroke-width="4"/>
  <use href="#person" x="412" y="352"/>
  <rect x="446" y="336" width="110" height="12" rx="6" fill="#C9A24B"/>
  <rect x="446" y="360" width="80" height="10" rx="5" fill="#4F7A6A"/>
  <text x="475" y="440" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#7E5D19" text-anchor="middle">real owner</text>

  <path d="M752 274 H678" stroke="#9C3B25" stroke-width="5" stroke-dasharray="8 7"/>
  <path d="M664 252 L688 296 M688 252 L664 296" stroke="#9C3B25" stroke-width="6" stroke-linecap="round"/>
  <rect x="764" y="226" width="146" height="98" rx="10" fill="#F8F5EC" stroke="#9C3B25" stroke-width="3"/>
  <path d="M764 236 L837 288 L910 236" fill="none" stroke="#9C3B25" stroke-width="3"/>
  <text x="837" y="372" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#9C3B25" text-anchor="middle">outside</text>
</svg>
