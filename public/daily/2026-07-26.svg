    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe085"/>
      <stop offset="1" stop-color="#d79942"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ef8274"/>
      <stop offset="1" stop-color="#ad4a5b"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b9b7ff"/>
      <stop offset="1" stop-color="#6267a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#193144" flood-opacity=".24"/>
    </filter>
  </defs>

