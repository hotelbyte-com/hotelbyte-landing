<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Deprecated room-code migration blueprint</title>
  <desc id="desc">An editorial blueprint shows a greyed-out old room-code row, a new room-code card, channel inventory cells, rate-plan ribbon, historical order box, settlement evidence folder, content-field tags, last-sellable clock, owner marker, and connector lines for migration state.</desc>
  <defs>
    <linearGradient id="blueprint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eaf3f6"/>
      <stop offset="0.48" stop-color="#b9d1d8"/>
      <stop offset="1" stop-color="#243f56"/>
    </linearGradient>
    <linearGradient id="oldRow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e1e7e8"/>
      <stop offset="1" stop-color="#8e9aa0"/>
    </linearGradient>
    <linearGradient id="newCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fff7"/>
      <stop offset="1" stop-color="#7fb8a2"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#21465e"/>
      <stop offset="1" stop-color="#0e2233"/>
