  <path d="M366 230c54-78 100-112 146-102M584 214c34 34 60 74 80 120M424 250c42 34 66 66 78 96M272 336c4 40 0 66-12 88M318 418c52 8 92 6 124-8M590 420c56 26 104 28 146 8M752 156c-36 18-66 42-92 72" fill="none" stroke="#ffe085" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 16" opacity=".9"/>
