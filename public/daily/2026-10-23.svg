<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A catalogue row whose platform hotel is gone is set aside as delisted</title>
  <desc id="desc">A catalogue list with one row linked by a broken dashed line to an empty hotel outline; the row is diverted from the queue to suppliers into a tray marked delisted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9C3B25"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <rect x="80" y="150" width="240" height="250" rx="14" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <g fill="#4F7A6A">
    <rect x="102" y="174" width="196" height="28" rx="6"/>
    <rect x="102" y="214" width="196" height="28" rx="6"/>
    <rect x="102" y="294" width="196" height="28" rx="6"/>
    <rect x="102" y="334" width="196" height="28" rx="6"/>
  </g>
  <rect x="102" y="254" width="196" height="28" rx="6" fill="#D96C4F" stroke="#9C3B25" stroke-width="3"/>
  <text x="200" y="448" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">catalogue</text>

  <path d="M298 262 L338 214" stroke="#9C3B25" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M352 196 L380 162" stroke="#9C3B25" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M372 140 L420 100 L468 140 V196 H372 Z" fill="none" stroke="#9C3B25" stroke-width="4" stroke-dasharray="12 10"/>

  <path d="M330 300 H700" stroke="#1C2823" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#4F7A6A">
    <rect x="400" y="286" width="40" height="28" rx="6"/>
    <rect x="500" y="286" width="40" height="28" rx="6"/>
    <rect x="600" y="286" width="40" height="28" rx="6"/>
  </g>
  <rect x="716" y="224" width="170" height="150" rx="14" fill="#4F7A6A" stroke="#1C2823" stroke-width="3"/>
  <g fill="#F8F5EC">
    <rect x="740" y="252" width="122" height="14" rx="7"/><rect x="740" y="282" width="96" height="14" rx="7"/><rect x="740" y="312" width="110" height="14" rx="7"/>
  </g>
  <text x="801" y="416" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">suppliers</text>

  <path d="M330 268 C372 268 360 404 490 406" stroke="#9C3B25" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="500" y="376" width="150" height="62" rx="10" fill="#F2EEE2" stroke="#9C3B25" stroke-width="3"/>
  <rect x="542" y="392" width="40" height="28" rx="6" fill="#D96C4F" stroke="#9C3B25" stroke-width="2"/>
  <text x="575" y="478" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#9C3B25" text-anchor="middle">delisted</text>
</svg>
