<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Chinese names added in brackets when the data has them</title>
  <desc id="desc">Three name cards in a content library, two with English and Chinese names and one with English only, feeding search result rows where the Chinese name is added in brackets only when it exists.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7E5D19"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <g fill="#F8F5EC" stroke="#7E5D19" stroke-width="3">
    <rect x="80" y="150" width="210" height="58" rx="10"/>
    <rect x="80" y="240" width="210" height="58" rx="10"/>
    <rect x="80" y="330" width="210" height="58" rx="10"/>
  </g>
  <g fill="#1C2823" fill-opacity="0.75">
    <rect x="100" y="162" width="130" height="12" rx="6"/>
    <rect x="100" y="263" width="130" height="12" rx="6"/>
    <rect x="100" y="342" width="130" height="12" rx="6"/>
  </g>
  <g fill="#C9A24B">
    <rect x="100" y="184" width="84" height="12" rx="6"/>
    <rect x="100" y="364" width="84" height="12" rx="6"/>
  </g>
  <text x="185" y="444" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">content</text>

  <g stroke="#7E5D19" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M298 179 L424 208"/>
    <path d="M298 269 L424 286"/>
    <path d="M298 359 L424 364"/>
  </g>

  <rect x="432" y="96" width="452" height="320" rx="16" fill="#F8F5EC" stroke="#4F7A6A" stroke-width="3"/>
  <rect x="452" y="112" width="200" height="46" rx="23" fill="#1C2823"/>
  <text x="552" y="144" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#F8F5EC" text-anchor="middle">Chinese UI</text>

  <g fill="#4F7A6A" fill-opacity="0.55">
    <rect x="452" y="182" width="52" height="52" rx="8"/>
    <rect x="452" y="260" width="52" height="52" rx="8"/>
    <rect x="452" y="338" width="52" height="52" rx="8"/>
  </g>
  <g fill="#1C2823" fill-opacity="0.75">
    <rect x="522" y="201" width="170" height="14" rx="7"/>
    <rect x="522" y="279" width="170" height="14" rx="7"/>
    <rect x="522" y="357" width="170" height="14" rx="7"/>
  </g>
  <g stroke="#7E5D19" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M718 186 Q702 208 718 230"/><path d="M850 186 Q866 208 850 230"/>
    <path d="M718 342 Q702 364 718 386"/><path d="M850 342 Q866 364 850 386"/>
  </g>
  <g fill="#C9A24B">
    <rect x="730" y="201" width="108" height="14" rx="7"/>
    <rect x="730" y="357" width="108" height="14" rx="7"/>
  </g>
  <text x="658" y="460" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">results</text>
</svg>
