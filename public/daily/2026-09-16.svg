<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Per-market files merged into one sheet with two currency columns</title>
  <desc id="desc">Three small files on the left flow into one large sheet whose amounts appear in an original currency column and a business currency column, with dashed blank cells where no data arrived.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7E5D19"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <g stroke="#1C2823" stroke-width="2" fill="#F8F5EC">
    <path d="M70 92 H158 L186 120 V206 H70 Z"/>
    <path d="M70 222 H158 L186 250 V336 H70 Z"/>
    <path d="M70 352 H158 L186 380 V466 H70 Z"/>
  </g>
  <g fill="#C9A24B">
    <rect x="86" y="136" width="80" height="10" rx="5"/><rect x="86" y="160" width="58" height="10" rx="5"/>
    <rect x="86" y="266" width="80" height="10" rx="5"/><rect x="86" y="290" width="58" height="10" rx="5"/>
    <rect x="86" y="396" width="80" height="10" rx="5"/><rect x="86" y="420" width="58" height="10" rx="5"/>
  </g>
  <g stroke="#7E5D19" stroke-width="4" fill="none" marker-end="url(#tip)">
    <path d="M196 150 C290 150 300 270 386 270"/>
    <path d="M196 280 H386"/>
    <path d="M196 410 C290 410 300 290 386 290"/>
  </g>

  <rect x="408" y="70" width="482" height="390" rx="14" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <rect x="408" y="70" width="482" height="58" rx="14" fill="#1C2823"/>
  <rect x="408" y="110" width="482" height="18" fill="#1C2823"/>
  <text x="649" y="110" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#F2EEE2" text-anchor="middle">one file</text>

  <g stroke="#D8D1BD" stroke-width="2">
    <path d="M424 190 H874"/><path d="M424 240 H874"/><path d="M424 290 H874"/><path d="M424 340 H874"/><path d="M424 390 H874"/>
  </g>
  <g fill="#1C2823" opacity="0.75">
    <rect x="430" y="156" width="130" height="12" rx="6"/><rect x="430" y="206" width="110" height="12" rx="6"/>
    <rect x="430" y="256" width="124" height="12" rx="6"/><rect x="430" y="306" width="100" height="12" rx="6"/>
    <rect x="430" y="356" width="118" height="12" rx="6"/><rect x="430" y="406" width="96" height="12" rx="6"/>
  </g>
  <g fill="#C9A24B" stroke="#7E5D19" stroke-width="2">
    <circle cx="630" cy="162" r="15"/><circle cx="630" cy="212" r="15"/><circle cx="630" cy="262" r="15"/>
    <circle cx="630" cy="312" r="15"/><circle cx="630" cy="362" r="15"/><circle cx="630" cy="412" r="15"/>
  </g>
  <g fill="#4F7A6A" stroke="#1C2823" stroke-width="2">
    <circle cx="706" cy="162" r="15"/><circle cx="706" cy="212" r="15"/>
    <circle cx="706" cy="312" r="15"/><circle cx="706" cy="412" r="15"/>
  </g>
  <g fill="none" stroke="#9C3B25" stroke-width="3" stroke-dasharray="7 6">
    <rect x="689" y="245" width="34" height="34" rx="6"/>
    <rect x="689" y="345" width="34" height="34" rx="6"/>
  </g>
  <g fill="#D8D1BD">
    <rect x="760" y="156" width="96" height="12" rx="6"/><rect x="760" y="206" width="80" height="12" rx="6"/>
    <rect x="760" y="256" width="90" height="12" rx="6"/><rect x="760" y="306" width="70" height="12" rx="6"/>
    <rect x="760" y="356" width="88" height="12" rx="6"/><rect x="760" y="406" width="76" height="12" rx="6"/>
  </g>
  <text x="668" y="505" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">two currencies</text>
  <text x="128" y="505" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">by market</text>
</svg>
