<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Import manifest keeps distribution updates accountable</title>
  <desc id="desc">Editorial view of an import manifest where source package, changed fields, timezone boundary, checksum seal, and channel landing rails form one auditable distribution object.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="52%" stop-color="#d6e3ff"/>
      <stop offset="100%" stop-color="#213d61"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7eeff"/>
      <stop offset="100%" stop-color="#45c1d2"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd39e"/>
      <stop offset="100%" stop-color="#db8e3d"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d0bcff"/>
      <stop offset="100%" stop-color="#7b64cb"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc5bf"/>
      <stop offset="100%" stop-color="#cf6f77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#11273d" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <ellipse cx="240" cy="58" rx="240" ry="42" fill="#ffffff" opacity="0.22"/>
  <g opacity="0.17" stroke="#ffffff">
    <path d="M60 90h840M60 168h840M60 246h840M60 324h840M60 402h840M60 480h840" stroke-width="1.6"/>
    <path d="M120 60v420M300 60v420M480 60v420M660 60v420M840 60v420" stroke-width="1.1"/>
  </g>

  <g transform="translate(58 112)" filter="url(#shadow)">
    <rect width="380" height="382" rx="24" fill="url(#node)"/>
    <rect x="18" y="16" width="344" height="48" rx="16" fill="#1d3f61"/>
    <text x="34" y="48" fill="#ffd78b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">SUPPLIER MANIFEST</text>

    <rect x="26" y="74" width="324" height="52" rx="14" fill="url(#badge)"/>
    <text x="40" y="106" fill="#0f3f48" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">manifest_id: MF-2026-09-12-AB</text>

    <rect x="26" y="136" width="324" height="46" rx="12" fill="#f5faff"/>
    <text x="40" y="164" fill="#2c4e6c" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700">source_file: supplier_bundle_0929.diff.gz</text>

    <rect x="26" y="190" width="148" height="38" rx="11" fill="url(#sun)"/>
    <text x="39" y="215" fill="#582f00" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700">checksum: 8f6e..c11a</text>
    <rect x="184" y="190" width="166" height="38" rx="11" fill="url(#violet)"/>
    <text x="197" y="215" fill="#fff7ff" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700">scope: GLOBAL-ENT</text>

    <rect x="26" y="238" width="324" height="42" rx="12" fill="#edf4ff"/>
    <text x="40" y="262" fill="#2c4e6c" font-family="Inter, Arial, sans-serif" font-size="10.8" font-weight="700">effective_from: 2026-09-12T10:00+04:00</text>

    <rect x="26" y="290" width="324" height="38" rx="12" fill="url(#node)"/>
    <text x="40" y="314" fill="#2c4e6c" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700">owner: Distribution Release Steward</text>

    <rect x="26" y="338" width="324" height="22" rx="11" fill="#1e4b6f"/>
    <text x="40" y="354" fill="#e8f5ff" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700">roll_back_target: MF-2026-09-11</text>

    <rect x="26" y="372" width="324" height="6" rx="3" fill="url(#rose)"/>
