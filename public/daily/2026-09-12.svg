    <rect x="14" y="14" width="208" height="34" rx="16" fill="url(#node)"/>
    <text x="28" y="37" fill="#1f4a6e" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">TIMELINE & SEAL</text>

    <text x="28" y="72" fill="#dcecff" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">timezone: Asia/Dubai</text>
    <line x1="34" y1="86" x2="204" y2="86" stroke="#7f9fc0" stroke-width="3"/>
    <circle cx="50" cy="104" r="10" fill="url(#badge)"/>
    <text x="66" y="110" fill="#e8f7ff" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">effective_from</text>
    <circle cx="120" cy="104" r="10" fill="url(#sun)"/>
    <text x="136" y="110" fill="#f7dfb8" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">window_lock</text>
    <circle cx="190" cy="104" r="10" fill="url(#violet)"/>
    <text x="206" y="110" fill="#ebe7ff" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">rollback</text>

    <rect x="28" y="132" width="180" height="74" rx="14" fill="#1a4263"/>
    <rect x="40" y="148" width="156" height="34" rx="10" fill="url(#badge)"/>
    <text x="54" y="169" fill="#0f3e46" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">checksum verified</text>
    <text x="54" y="184" fill="#0f3e46" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">signature: sealed</text>

    <text x="28" y="234" fill="#dcecff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">replay path</text>
    <path d="M48 250C80 250 80 286 112 286" stroke="#89d4c6" stroke-width="6" stroke-linecap="round"/>
    <path d="M112 286C150 286 170 286 210 286" stroke="#dba06a" stroke-width="6" stroke-linecap="round"/>
    <rect x="208" y="276" width="12" height="20" rx="6" fill="#dba06a"/>

    <rect x="28" y="310" width="180" height="40" rx="12" fill="url(#rose)"/>
    <text x="46" y="336" fill="#fff5f8" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800">rollback gate</text>

    <line x1="118" y1="350" x2="118" y2="334" stroke="#f9bf6f" stroke-width="2"/>
    <line x1="118" y1="350" x2="118" y2="360" stroke="#ffe0b5" stroke-width="2"/>
    <circle cx="118" cy="360" r="8" fill="url(#sun)"/>
  </g>

  <g transform="translate(220 398)">
    <rect x="0" y="0" width="210" height="84" rx="16" fill="url(#node)"/>
    <rect x="14" y="14" width="182" height="28" rx="12" fill="url(#badge)"/>
    <text x="26" y="32" fill="#0e3f48" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="800">evidence folder</text>
    <rect x="14" y="48" width="182" height="22" rx="11" fill="url(#violet)"/>
    <text x="27" y="63" fill="#fbf6ff" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700">reconcile_ticket: ET-0912</text>
  </g>

  <g fill="none" stroke="#294f71" stroke-width="3" stroke-linecap="round">
    <path d="M438 212C474 212 474 194 512 194"/>
    <path d="M438 212C470 212 470 286 506 286"/>
    <path d="M644 194L676 194" stroke="#3f95ad"/>
    <path d="M644 286L676 286" stroke="#9e5f62"/>
    <path d="M438 286C472 286 472 356 504 356"/>
    <path d="M674 356L720 356"/>
    <path d="M812 194L846 194" stroke="#ffce90"/>
    <path d="M812 286L846 286" stroke="#a97de2"/>
