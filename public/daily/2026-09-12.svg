  <circle cx="850" cy="82" r="19" fill="none" stroke="#ffffff" stroke-width="4"/> 
  <text x="841" y="87" fill="#5a2f00" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="900">✓</text>

</svg>
