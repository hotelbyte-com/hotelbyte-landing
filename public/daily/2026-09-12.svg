    <text x="22" y="76" fill="#17464e" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">room_type_label</text>

    <rect x="16" y="92" width="142" height="28" rx="10" fill="url(#sun)"/>
    <text x="22" y="110" fill="#562f00" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">channel_scope</text>

    <rect x="16" y="126" width="142" height="28" rx="10" fill="url(#violet)"/>
    <text x="22" y="144" fill="#fff8ff" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">effective_window</text>

    <rect x="16" y="160" width="142" height="8" rx="4" fill="#c6d8f5"/>
    <rect x="16" y="160" width="64" height="8" rx="4" fill="url(#badge)"/>
  </g>

