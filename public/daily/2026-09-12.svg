    <rect x="16" y="54" width="142" height="26" rx="11" fill="url(#rose)"/>
    <text x="30" y="71" fill="#4f1f28" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">B2B · OPEN</text>
