    <text x="30" y="105" fill="#4f300a" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">OTA · CLOSED</text>
    <rect x="16" y="112" width="142" height="14" rx="7" fill="#1f4a6e"/>
    <text x="30" y="122" fill="#dbe8ff" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700">replay: strict</text>
  </g>

  <g transform="translate(676 104)" filter="url(#shadow)">
