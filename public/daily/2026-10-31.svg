<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A long hotel list split into batches a supplier accepts</title>
  <desc id="desc">A long list of hotel IDs split into a large and a small part, carried in two crates into a supplier window one after another, and merged back in the original order.</desc>
