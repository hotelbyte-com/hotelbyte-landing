<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Market toggle configuration board</title>
  <desc id="desc">An editorial configuration board showing market switches split into visible, bookable, and settleable rails with sub-channel chips, contract stamp, settlement dial, expiry calendar, stop-sell overlay, and approval pins.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef4ee"/>
      <stop offset=".46" stop-color="#ccd9dc"/>
      <stop offset="1" stop-color="#25364a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset="1" stop-color="#dfe9dd"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#223347"/>
      <stop offset="1" stop-color="#101a27"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f4e7"/>
      <stop offset="1" stop-color="#4ea486"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe287"/>
      <stop offset="1" stop-color="#d99639"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f58b75"/>
      <stop offset="1" stop-color="#b84b55"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c7e8ff"/>
      <stop offset="1" stop-color="#4d82b7"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c8bdff"/>
      <stop offset="1" stop-color="#625aa2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1a2836" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#wall)"/>
  <g opacity=".2" stroke="#ffffff" stroke-width="2">
    <path d="M90 88h780M90 132h780M90 176h780M90 220h780M90 264h780M90 308h780M90 352h780M90 396h780"/>
    <path d="M134 66v384M220 66v384M306 66v384M392 66v384M478 66v384M564 66v384M650 66v384M736 66v384M822 66v384"/>
  </g>
  <path d="M74 76h812M112 120h704M84 462h792" stroke="#fff8e6" stroke-width="8" stroke-linecap="round" opacity=".46"/>
  <path d="M98 404c108-30 224-26 350 10 144 42 284 22 414-62" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <rect x="74" y="350" width="812" height="108" rx="30" fill="#1f2d3b" opacity=".13"/>

  <g transform="translate(86 84)" filter="url(#shadow)">
    <rect width="392" height="326" rx="30" fill="url(#panel)"/>
    <rect x="28" y="26" width="168" height="38" rx="14" fill="url(#ink)"/>
    <path d="M52 45h92" stroke="#ffe287" stroke-width="8" stroke-linecap="round"/>
    <path d="M44 96h86M44 172h86M44 248h86" stroke="#51615f" stroke-width="8" stroke-linecap="round"/>

    <g transform="translate(150 78)">
      <rect width="190" height="44" rx="22" fill="#e8f4ee"/>
      <circle cx="150" cy="22" r="18" fill="url(#mint)"/>
      <path d="M28 22h64" stroke="#6a7a76" stroke-width="8" stroke-linecap="round"/>
      <text x="-114" y="29" fill="#20323c" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900">UAE</text>
    </g>
    <g transform="translate(150 154)">
      <rect width="190" height="44" rx="22" fill="#e8f4ee"/>
      <circle cx="150" cy="22" r="18" fill="url(#mint)"/>
      <path d="M28 22h64" stroke="#6a7a76" stroke-width="8" stroke-linecap="round"/>
      <text x="-112" y="29" fill="#20323c" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900">KSA</text>
    </g>
    <g transform="translate(150 230)">
      <rect width="190" height="44" rx="22" fill="#e5e9e8"/>
      <circle cx="42" cy="22" r="18" fill="#8a9697"/>
      <path d="M78 22h70" stroke="#9aa6a3" stroke-width="8" stroke-linecap="round"/>
      <text x="-126" y="29" fill="#20323c" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900">QATAR</text>
    </g>
    <text x="34" y="368" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">market toggle stack</text>
  </g>

  <g transform="translate(512 82)" filter="url(#shadow)">
    <rect width="346" height="216" rx="30" fill="#f8fbf2"/>
    <rect x="28" y="28" width="96" height="34" rx="14" fill="url(#blue)"/>
    <rect x="140" y="28" width="96" height="34" rx="14" fill="url(#amber)"/>
    <rect x="252" y="28" width="66" height="34" rx="14" fill="url(#coral)"/>
    <text x="36" y="51" fill="#20323c" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">VISIBLE</text>
    <text x="150" y="51" fill="#40301b" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">BOOK</text>
    <text x="260" y="51" fill="#fff8e8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">SETTLE</text>
    <path d="M44 96h254M44 140h254M44 184h254" stroke="#91a29d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="84" cy="96" r="15" fill="url(#blue)"/>
    <circle cx="180" cy="96" r="15" fill="url(#amber)"/>
    <circle cx="276" cy="96" r="15" fill="url(#coral)"/>
    <circle cx="84" cy="140" r="15" fill="url(#blue)"/>
    <circle cx="180" cy="140" r="15" fill="url(#amber)"/>
    <circle cx="276" cy="140" r="15" fill="#b8c1bd"/>
    <circle cx="84" cy="184" r="15" fill="url(#blue)"/>
    <circle cx="180" cy="184" r="15" fill="#b8c1bd"/>
    <circle cx="276" cy="184" r="15" fill="#b8c1bd"/>
    <text x="6" y="256" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">visible / bookable / settleable rails</text>
  </g>

  <path d="M458 184C502 160 526 146 558 124" fill="none" stroke="#4d82b7" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 16"/>
  <path d="M458 230c42-2 76-10 112-34" fill="none" stroke="#d99639" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 14"/>
  <path d="M458 276c44 26 78 34 112 16" fill="none" stroke="#b84b55" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 16"/>

  <g transform="translate(570 338)" filter="url(#shadow)">
    <rect width="148" height="120" rx="28" fill="url(#violet)"/>
    <path d="M28 38h92M28 70h62" stroke="#fff8e8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="112" cy="82" r="20" fill="#fffdf1"/>
    <path d="M102 82h20M112 72v20" stroke="#625aa2" stroke-width="6" stroke-linecap="round"/>
    <text x="-8" y="156" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">sub-channel chips</text>
  </g>

  <g transform="translate(742 324)" filter="url(#shadow)">
    <circle cx="64" cy="64" r="58" fill="#fffdf1"/>
    <path d="M64 64V28M64 64l28 18" stroke="#223347" stroke-width="8" stroke-linecap="round"/>
    <path d="M34 106h60" stroke="#4ea486" stroke-width="10" stroke-linecap="round"/>
    <text x="-18" y="156" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">settlement currency dial</text>
  </g>

  <g transform="translate(176 424)" filter="url(#shadow)">
    <rect width="158" height="76" rx="24" fill="url(#coral)"/>
    <path d="M30 30h92M30 52h62" stroke="#fff8e8" stroke-width="8" stroke-linecap="round"/>
    <text x="-10" y="112" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">stop-sell overlay</text>
  </g>

  <g transform="translate(384 420)" filter="url(#shadow)">
    <rect width="144" height="78" rx="24" fill="url(#amber)"/>
    <path d="M32 34h80M32 56h42" stroke="#4d3a21" stroke-width="8" stroke-linecap="round"/>
    <circle cx="112" cy="38" r="16" fill="#fffdf1"/>
    <text x="-4" y="114" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">auto-expiry date</text>
  </g>

  <g transform="translate(662 36)" filter="url(#shadow)">
    <circle cx="58" cy="58" r="50" fill="#fffdf1"/>
    <circle cx="58" cy="58" r="32" fill="none" stroke="url(#mint)" stroke-width="10"/>
    <path d="M42 58h32M58 42v32" stroke="#4ea486" stroke-width="7" stroke-linecap="round"/>
    <text x="-8" y="142" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">contract stamp</text>
  </g>

  <g transform="translate(802 108)" filter="url(#shadow)">
    <circle cx="22" cy="22" r="18" fill="url(#coral)"/>
    <path d="M22 40v70" stroke="#b84b55" stroke-width="8" stroke-linecap="round"/>
    <circle cx="22" cy="110" r="10" fill="#fffdf1"/>
    <text x="-48" y="150" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">approval pin</text>
  </g>
</svg>
