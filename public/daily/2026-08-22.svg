    <circle cx="0" cy="0" r="7" fill="#d6f1ed"/>
    <text x="-24" y="16" fill="#1d2f46" font-family="Inter, sans-serif" font-size="10" font-weight="700">audit</text>
  </g>

  <g transform="translate(260 460)">
    <line x1="0" y1="0" x2="-26" y2="-34" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="0" r="7" fill="#ffd0a9"/>
    <text x="-36" y="14" fill="#1d2f46" font-family="Inter, sans-serif" font-size="10" font-weight="700">audit</text>
