    <rect x="0" y="0" width="250" height="42" rx="16" fill="url(#violet)"/>
    <text x="18" y="28" fill="#fff4dc" font-family="Inter, sans-serif" font-size="16" font-weight="700">OTA channel map</text>
    <rect x="18" y="58" width="212" height="28" rx="10" fill="#fff4ea"/>
    <text x="34" y="77" fill="#3c4562" font-family="Inter, sans-serif" font-size="12" font-weight="700">room_type_in = king size</text>
    <rect x="18" y="94" width="212" height="28" rx="10" fill="url(#mint)"/>
    <text x="34" y="113" fill="#144e46" font-family="Inter, sans-serif" font-size="12" font-weight="700">fallback: normalize 2-pass</text>
    <rect x="18" y="132" width="212" height="28" rx="10" fill="#f1f5ff"/>
    <text x="34" y="151" fill="#3d4b66" font-family="Inter, sans-serif" font-size="12" font-weight="700">settle_owner = partner</text>
  </g>

  <g transform="translate(764 116)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="112" rx="18" fill="url(#ocean)"/>
    <text x="18" y="28" fill="#184a63" font-family="Inter, sans-serif" font-size="12" font-weight="700">market</text>
    <rect x="14" y="40" width="92" height="22" rx="10" fill="url(#sunset)"/>
    <text x="27" y="56" fill="#5b220f" font-family="Inter, sans-serif" font-size="11">Dubai</text>
    <rect x="14" y="70" width="92" height="22" rx="10" fill="url(#mint)"/>
    <text x="32" y="86" fill="#1b4f44" font-family="Inter, sans-serif" font-size="11">UAE</text>
    <rect x="14" y="96" width="92" height="8" rx="4" fill="#f7fdfe" opacity="0.8"/>
