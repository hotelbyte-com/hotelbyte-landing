<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bed-type synonym routing keeps room meaning stable</title>
  <desc id="desc">An editorial room-type mapping scene with a canonical type card, synonym chips, channel mapping cards, market scope lanes, version lock, fallback policy pin, and settlement ownership connectors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edf5f4"/>
      <stop offset="1" stop-color="#213049"/>
    </linearGradient>
    <linearGradient id="board" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf0f8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2b3f57"/>
      <stop offset="1" stop-color="#1a2432"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b7e8ef"/>
      <stop offset="1" stop-color="#4fb5cf"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffce9a"/>
      <stop offset="1" stop-color="#d77b53"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dff3ef"/>
      <stop offset="1" stop-color="#6ec6ad"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9ceff"/>
      <stop offset="1" stop-color="#7159be"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#152136" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <ellipse cx="500" cy="84" rx="420" ry="86" fill="#ffffff" opacity="0.27"/>

  <g opacity="0.18" stroke="#ffffff" stroke-width="2">
    <path d="M78 110h804M78 176h804M78 242h804M78 308h804M78 374h804M78 440h804"/>
    <path d="M78 110v340M168 110v340M258 110v340M348 110v340M438 110v340M528 110v340M618 110v340M708 110v340M798 110v340"/>
  </g>

  <g transform="translate(106 116)" filter="url(#shadow)">
    <rect x="0" y="0" width="328" height="324" rx="28" fill="url(#board)"/>
    <rect x="0" y="0" width="328" height="54" rx="26" fill="url(#ink)"/>
    <text x="22" y="36" fill="#f4d49c" font-family="Inter, sans-serif" font-size="20" font-weight="700">Canonical type object</text>

    <text x="20" y="82" fill="#2f4760" font-family="Inter, sans-serif" font-size="14" font-weight="700">canonical_bed_code</text>
    <rect x="20" y="88" width="288" height="42" rx="12" fill="url(#ocean)"/>
    <text x="38" y="114" fill="#15324a" font-family="Inter, sans-serif" font-size="17" font-weight="700">KING_STD</text>

    <text x="20" y="148" fill="#2f4760" font-family="Inter, sans-serif" font-size="12" font-weight="700">synonym bundle</text>
    <rect x="20" y="154" width="136" height="32" rx="11" fill="url(#mint)"/>
    <text x="36" y="175" fill="#1f5345" font-family="Inter, sans-serif" font-size="12" font-weight="700">king</text>
    <rect x="168" y="154" width="140" height="32" rx="11" fill="url(#sunset)"/>
    <text x="178" y="175" fill="#5d2a13" font-family="Inter, sans-serif" font-size="12" font-weight="700">king-size</text>

    <rect x="20" y="196" width="140" height="36" rx="12" fill="url(#board)"/>
    <text x="36" y="219" fill="#35506f" font-family="Inter, sans-serif" font-size="11" font-weight="700">version 3</text>
    <rect x="172" y="196" width="136" height="36" rx="12" fill="url(#violet)"/>
    <text x="193" y="219" fill="#fff4dc" font-family="Inter, sans-serif" font-size="11" font-weight="700">market_scope</text>

