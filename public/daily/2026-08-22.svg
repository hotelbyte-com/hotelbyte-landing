    <rect x="0" y="0" width="250" height="42" rx="16" fill="url(#ocean)"/>
    <text x="18" y="28" fill="#184c64" font-family="Inter, sans-serif" font-size="17" font-weight="700">B2B channel map</text>
    <rect x="18" y="58" width="212" height="28" rx="10" fill="url(#mint)"/>
    <text x="34" y="77" fill="#14503f" font-family="Inter, sans-serif" font-size="12" font-weight="700">room_type_out = KING_STD</text>
    <rect x="18" y="94" width="212" height="28" rx="10" fill="#f3f7ff"/>
    <text x="34" y="113" fill="#354a64" font-family="Inter, sans-serif" font-size="12" font-weight="700">commission_line = enterprise</text>
    <rect x="18" y="132" width="212" height="28" rx="10" fill="url(#sunset)"/>
    <text x="34" y="151" fill="#5a2410" font-family="Inter, sans-serif" font-size="12" font-weight="700">settle_owner = core</text>
  </g>

  <g transform="translate(480 292)" filter="url(#shadow)">
