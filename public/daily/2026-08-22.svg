  <g transform="translate(764 266)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="112" rx="18" fill="url(#mint)"/>
    <text x="20" y="28" fill="#134f42" font-family="Inter, sans-serif" font-size="11" font-weight="700">version lock</text>
    <circle cx="60" cy="58" r="18" fill="url(#ink)"/>
    <path d="M50 58h20M60 48v20" stroke="#f7efe0" stroke-width="4" stroke-linecap="round"/>
    <rect x="20" y="82" width="80" height="18" rx="8" fill="url(#sunset)"/>
    <text x="32" y="96" fill="#502514" font-family="Inter, sans-serif" font-size="10" font-weight="700">v3.2</text>
  </g>

  <g stroke-linecap="round" fill="none">
    <path d="M446 248C520 248 520 184 484 156" stroke="url(#ocean)" stroke-width="9"/>
    <path d="M446 248C520 248 520 308 484 336" stroke="url(#sunset)" stroke-width="9"/>
    <path d="M732 188C742 188 752 188 766 188" stroke="#2f4664" stroke-width="6"/>
    <path d="M732 370C742 370 752 370 766 370" stroke="#2f4664" stroke-width="6"/>
  </g>

  <g fill="#1f3954" font-family="Inter, sans-serif" font-size="11" opacity="0.9">
    <text x="760" y="232">alias routing line</text>
    <text x="760" y="352">compliance line</text>
  </g>

  <g transform="translate(190 446)">
    <rect x="0" y="0" width="560" height="58" rx="20" fill="#1f3954" opacity="0.86"/>
    <text x="20" y="38" fill="#f8d7a8" font-family="Inter, sans-serif" font-size="17" font-weight="700">settlement owner and commission stay on one canonical room object</text>
