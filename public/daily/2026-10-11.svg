<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">The customer summary is a subset of the seller summary</title>
  <desc id="desc">Five seller cards on top and four customer cards below, with a dashed empty slot where profit would be and a coin in the customer currency.</desc>
  <rect width="960" height="540" fill="#F2EEE2"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="#F8F5EC" stroke="#D8D1BD" stroke-width="2"/>

  <text x="80" y="104" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823">seller</text>
  <g stroke="#1C2823" stroke-width="3" fill="#F2EEE2">
    <rect x="80" y="124" width="140" height="110" rx="12"/>
    <rect x="240" y="124" width="140" height="110" rx="12"/>
    <rect x="400" y="124" width="140" height="110" rx="12"/>
    <rect x="560" y="124" width="140" height="110" rx="12"/>
    <rect x="720" y="124" width="140" height="110" rx="12"/>
  </g>
  <g>
    <rect x="100" y="150" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="100" y="182" width="90" height="26" rx="6" fill="#4F7A6A"/>
    <rect x="260" y="150" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="260" y="182" width="90" height="26" rx="6" fill="#4F7A6A"/>
    <rect x="420" y="150" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="420" y="182" width="90" height="26" rx="6" fill="#C9A24B"/>
    <rect x="580" y="150" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="580" y="182" width="90" height="26" rx="6" fill="#7E5D19"/>
    <rect x="740" y="150" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="740" y="182" width="90" height="26" rx="6" fill="#9C3B25"/>
  </g>

  <g stroke="#D8D1BD" stroke-width="3" stroke-dasharray="8 8">
    <path d="M150 244 V290"/><path d="M310 244 V290"/><path d="M470 244 V290"/><path d="M790 244 V290"/>
  </g>

  <text x="80" y="330" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823">customer</text>
  <g stroke="#1C2823" stroke-width="3" fill="#F2EEE2">
    <rect x="80" y="350" width="140" height="110" rx="12"/>
    <rect x="240" y="350" width="140" height="110" rx="12"/>
    <rect x="400" y="350" width="140" height="110" rx="12"/>
    <rect x="720" y="350" width="140" height="110" rx="12"/>
  </g>
  <rect x="560" y="350" width="140" height="110" rx="12" fill="none" stroke="#9C3B25" stroke-width="3" stroke-dasharray="10 8"/>
  <g>
    <rect x="100" y="376" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="100" y="408" width="90" height="26" rx="6" fill="#4F7A6A"/>
    <rect x="260" y="376" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="260" y="408" width="90" height="26" rx="6" fill="#4F7A6A"/>
    <rect x="420" y="376" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="420" y="408" width="90" height="26" rx="6" fill="#C9A24B"/>
    <rect x="740" y="376" width="70" height="14" rx="6" fill="#D8D1BD"/><rect x="740" y="408" width="90" height="26" rx="6" fill="#9C3B25"/>
  </g>
  <g transform="translate(470,318)">
    <circle r="22" fill="#C9A24B" stroke="#7E5D19" stroke-width="3"/>
    <circle r="12" fill="none" stroke="#7E5D19" stroke-width="3"/>
  </g>
</svg>
