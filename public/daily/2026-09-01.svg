<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Inventory clock and stop-sell reason map</title>
  <desc id="desc">An editorial scene showing an inventory window ledger, reason code chips, channel lanes, and a shared availability clock with resolver actions.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2640" />
      <stop offset="40%" stop-color="#132b49" />
      <stop offset="100%" stop-color="#1f1f46" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfdff" />
      <stop offset="100%" stop-color="#e7eef7" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#183c60" />
      <stop offset="100%" stop-color="#0a253f" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cded1" />
      <stop offset="100%" stop-color="#38a28f" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcf80" />
      <stop offset="100%" stop-color="#d28b33" />
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6a195" />
      <stop offset="100%" stop-color="#c05667" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ceb2ff" />
      <stop offset="100%" stop-color="#7150c4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#020814" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)" />
  <path d="M0 84H960M0 168H960M0 252H960M0 336H960M0 420H960M0 504H960" stroke="#cde5ff" stroke-opacity="0.10" stroke-width="2" />
  <path d="M84 0V540M252 0V540M420 0V540M588 0V540M756 0V540" stroke="#cde5ff" stroke-opacity="0.09" stroke-width="1.2" />

  <g transform="translate(34 34)">
    <text x="0" y="0" fill="#f1e7ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Daily story visual seed: reason-coded inventory windows</text>
    <text x="0" y="24" fill="#b8d4ee" font-family="Inter,Arial,sans-serif" font-size="12">2026-09-01</text>
  </g>

  <g transform="translate(66 88)" filter="url(#shadow)">
    <rect width="360" height="260" rx="24" fill="url(#paper)" />
    <rect x="14" y="14" width="332" height="46" rx="16" fill="url(#ink)" />
    <text x="28" y="43" fill="#ffd97e" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="900">INVENTORY WINDOW TABLE</text>

    <rect x="20" y="74" width="308" height="28" rx="10" fill="#e8f3ff" />
    <text x="30" y="92" fill="#24415f" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">inventory_clock_id: INV-220901</text>

    <rect x="20" y="110" width="308" height="36" rx="12" fill="url(#paper)" />
    <text x="34" y="128" fill="#2a4a6f" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">room_type: STANDARD-DELUXE</text>
    <text x="34" y="144" fill="#2a4a6f" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">effective_from: 2026-09-01T16:00+04:00</text>

    <rect x="20" y="156" width="308" height="34" rx="12" fill="url(#paper)" />
    <text x="34" y="174" fill="#2a4a6f" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">effective_until: 2026-09-01T22:00+04:00</text>
    <text x="34" y="188" fill="#2a4a6f" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">solver_state: boundary-bound</text>

    <rect x="20" y="201" width="308" height="42" rx="14" fill="#f4fbff" />
    <rect x="28" y="210" width="104" height="24" rx="12" fill="url(#mint)" />
    <text x="45" y="227" fill="#18484b" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800">stop_sell_reason_code</text>
    <rect x="140" y="210" width="168" height="24" rx="12" fill="url(#coral)" />
    <text x="154" y="227" fill="#fff3f0" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800">late-arrival-safety</text>

    <rect x="20" y="249" width="308" height="36" rx="12" fill="url(#violet)" />
    <text x="32" y="272" fill="#f7f7ff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">resolver_action: hold + reopen after supplier-confirmed</text>

    <rect x="20" y="289" width="308" height="18" rx="9" fill="#dde9f7" />
    <text x="34" y="302" fill="#304f6f" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">scope: UAE market · UAE / GCC channels</text>
  </g>

  <g transform="translate(452 82)" filter="url(#shadow)">
    <rect width="450" height="220" rx="24" fill="url(#paper)" />
    <rect x="18" y="16" width="414" height="42" rx="15" fill="url(#ink)" />
    <text x="33" y="41" fill="#ffd57a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="900">CHANNEL AVAILABILITY LANE</text>

    <rect x="26" y="70" width="390" height="28" rx="12" fill="#f2fbf8" />
    <rect x="38" y="78" width="108" height="12" rx="6" fill="url(#mint)" />
    <text x="155" y="88" fill="#2c516a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Channel A: OPEN</text>

    <rect x="26" y="104" width="390" height="28" rx="12" fill="#f4f5ff" />
    <rect x="38" y="112" width="108" height="12" rx="6" fill="url(#coral)" />
    <text x="155" y="122" fill="#2c516a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Channel B: PAUSED (reason applied)</text>

    <rect x="26" y="138" width="390" height="28" rx="12" fill="#f4f5ff" />
    <rect x="38" y="146" width="108" height="12" rx="6" fill="#7a95b4" />
    <text x="155" y="156" fill="#2c516a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Channel C: REVIEW HANGING</text>

    <rect x="26" y="176" width="390" height="28" rx="12" fill="#f4f5ff" />
    <rect x="38" y="184" width="108" height="12" rx="6" fill="url(#violet)" />
    <text x="155" y="194" fill="#2c516a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Channel D: CLOSED FOR NOW</text>

    <rect x="26" y="208" width="390" height="26" rx="12" fill="#0f2f4e" />
    <text x="41" y="225" fill="#f9d783" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">resolver lane: assign owner + expiry + reopen_at</text>
  </g>

  <g transform="translate(540 332)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="94" fill="#0f2e52" />
    <circle cx="0" cy="0" r="88" fill="none" stroke="#9ec5d8" stroke-width="8" />
    <circle cx="0" cy="0" r="62" fill="url(#mint)" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="4 8" />
    <line x1="0" y1="0" x2="0" y2="-52" stroke="#133b5d" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="42" y2="30" stroke="#133b5d" stroke-width="5" stroke-linecap="round" />
    <text x="-70" y="-70" fill="#dfefff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">availability clock</text>
    <text x="-62" y="-56" fill="#dfefff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">16:00 to 22:00</text>
    <rect x="-50" y="46" width="100" height="30" rx="14" fill="url(#amber)" />
    <text x="-20" y="66" fill="#4f2909" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">REOPEN</text>
  </g>

  <g transform="translate(72 392)">
    <rect width="280" height="116" rx="20" fill="url(#ink)" />
    <text x="16" y="28" fill="#ffd88a" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800">REASON STACK</text>

    <rect x="14" y="38" width="252" height="24" rx="10" fill="url(#coral)" />
    <text x="30" y="54" fill="#fff7f4" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">rate_sheet_mismatch</text>

    <rect x="14" y="66" width="252" height="24" rx="10" fill="url(#mint)" />
    <text x="30" y="82" fill="#124a4f" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">manual-confirmation-missing</text>

    <rect x="14" y="94" width="252" height="12" rx="6" fill="#d4e7f7" />
    <rect x="14" y="94" width="168" height="12" rx="6" fill="url(#violet)" />
  </g>

  <g transform="translate(690 392)">
    <rect width="300" height="116" rx="20" fill="#f6fcff" />
    <rect x="14" y="14" width="272" height="30" rx="12" fill="url(#ink)" />
    <text x="28" y="34" fill="#ffd37e" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900">RESOLVER TRACE</text>

    <rect x="24" y="52" width="252" height="18" rx="9" fill="#f2f9ff" />
    <text x="36" y="64" fill="#2d4963" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">set by: operations-control</text>

    <rect x="24" y="76" width="252" height="18" rx="9" fill="#f2f9ff" />
    <text x="36" y="88" fill="#2d4963" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">decision: hold, channel D, audit_required</text>

    <rect x="24" y="96" width="252" height="10" rx="5" fill="#cde4f5" />
    <rect x="24" y="96" width="180" height="10" rx="5" fill="url(#mint)" />
  </g>

  <path d="M426 192C462 192 500 190 540 190" fill="none" stroke="#89d7ca" stroke-width="5" />
  <path d="M426 312C468 312 496 314 540 314" fill="none" stroke="#f7cb78" stroke-width="5" />
  <path d="M452 232C500 232 560 224 602 262" fill="none" stroke="#7d98be" stroke-width="4" stroke-dasharray="7 9" />
  <path d="M426 348C470 348 520 348 560 348" fill="none" stroke="#ff9aa2" stroke-width="5" />

  <path d="M426 192L540 190" stroke="#9ce3d7" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M744 318L744 332" stroke="#f7d68f" stroke-width="4" />
  <path d="M744 404L540 404" stroke="#c4d8ed" stroke-width="3" />

  <line x1="540" y1="332" x2="540" y2="332" stroke="none" />

  <g transform="translate(620 314)">
    <circle cx="0" cy="0" r="8" fill="url(#amber)" />
    <text x="16" y="6" fill="#dce8f4" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">decision boundary</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 3L0 6Z" fill="#9ce3d7" />
    </marker>
  </defs>
</svg>
