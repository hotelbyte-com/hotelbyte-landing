<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Amenity renovation field keeping supplier content honest</title>
  <desc id="desc">An editorial content-specimen table shows an amenity status row, under-renovation tag, covered pool card, evidence photo, reopen-date clip, affected-room ruler, market-hide switch, alternative amenity note, owner stamp, and correction lines to a channel display card.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3f7ed"/>
      <stop offset=".46" stop-color="#d1e2d7"/>
      <stop offset="1" stop-color="#23424b"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="1" stop-color="#dce7d2"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#203746"/>
      <stop offset="1" stop-color="#101d28"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe36e"/>
      <stop offset="1" stop-color="#d79a34"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b9f0e2"/>
      <stop offset="1" stop-color="#3d8f99"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f47f6f"/>
      <stop offset="1" stop-color="#b54854"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c6bdff"/>
      <stop offset="1" stop-color="#6257a0"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dcf6a7"/>
      <stop offset="1" stop-color="#6fa858"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1a2c33" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#surface)"/>
  <g opacity=".18" stroke="#ffffff" stroke-width="2">
    <path d="M82 82h796M82 130h796M82 178h796M82 226h796M82 274h796M82 322h796M82 370h796M82 418h796"/>
    <path d="M128 62v404M212 62v404M296 62v404M380 62v404M464 62v404M548 62v404M632 62v404M716 62v404M800 62v404"/>
  </g>
  <ellipse cx="498" cy="294" rx="396" ry="178" fill="#fff8df" opacity=".18" filter="url(#soft)"/>
  <path d="M82 76h792M118 118h688M84 462h790" stroke="#fff8e5" stroke-width="8" stroke-linecap="round" opacity=".48"/>

  <g transform="translate(88 92)" filter="url(#shadow)">
    <rect width="396" height="284" rx="30" fill="url(#slab)"/>
    <rect x="28" y="28" width="338" height="60" rx="18" fill="url(#ink)"/>
    <text x="48" y="66" fill="#ffe36e" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">amenity_status</text>
    <path d="M42 122h96M42 166h146M42 210h118" stroke="#5b6b67" stroke-width="9" stroke-linecap="round"/>
    <rect x="184" y="106" width="162" height="48" rx="18" fill="url(#tag)"/>
