<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Coordinate precision keeps distribution on route</title>
  <desc id="desc">An editorial illustration showing a supplier content pack, pickup coordinate point, compass tolerance ring, and manifest cards linked by version and window controls.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2242" />
      <stop offset="1" stop-color="#173f67" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ea" />
      <stop offset="1" stop-color="#ebf4ff" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173f67" />
      <stop offset="1" stop-color="#0d263f" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84d1c5" />
      <stop offset="1" stop-color="#2f9c8e" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7be50" />
      <stop offset="1" stop-color="#e47c42" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a7ff" />
      <stop offset="1" stop-color="#8a6ad9" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="16" stdDeviation="10" flood-color="#041523" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)" />

  <g opacity="0.08" stroke="#92b3d9" stroke-width="1">
    <path d="M0 78H960M0 156H960M0 234H960M0 312H960M0 390H960M0 468H960" />
    <path d="M98 0V540M196 0V540M294 0V540M392 0V540M490 0V540M588 0V540M686 0V540M784 0V540M882 0V540" />
  </g>

  <g transform="translate(54 62)" filter="url(#shadow)">
    <rect width="286" height="204" rx="24" fill="url(#paper)" />
    <rect x="14" y="14" width="258" height="52" rx="18" fill="url(#ink)" />
    <text x="28" y="43" fill="#f9ce67" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">SUPPLIER CONTENT BUNDLE</text>
    <text x="24" y="90" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">activity_id: DX-PRK-30</text>
    <text x="24" y="108" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">meeting_point_raw: "Plaza Entrance"</text>
    <text x="24" y="126" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">normalized_coord: 24.45312, 54.32681</text>
    <text x="24" y="144" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">precision_policy: 1e-5 cap</text>
    <rect x="24" y="158" width="234" height="16" rx="8" fill="#dbe8f9" />
    <rect x="24" y="158" width="132" height="16" rx="8" fill="url(#mint)" />
    <rect x="24" y="178" width="234" height="14" rx="7" fill="#dbe8f9" />
    <rect x="24" y="178" width="62" height="14" rx="7" fill="url(#violet)" />
  </g>

  <g transform="translate(360 52)" filter="url(#shadow)">
    <rect width="536" height="236" rx="28" fill="#0f2f4f" />
    <rect x="16" y="16" width="120" height="36" rx="18" fill="#f9d06d" />
    <text x="30" y="38" fill="#172f47" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">MEET-POINT MAP</text>
    <rect x="16" y="64" width="500" height="156" rx="16" fill="url(#paper)" />

    <g transform="translate(70 116)">
      <path d="M210 20 C210 90 130 148 20 148 C-90 148 -150 90 -150 20 C-150 -50 -90 -110 20 -110 C130 -110 210 -50 210 20 Z" fill="#d7e8f6" stroke="#b9cfef" stroke-width="4" />
      <path d="M20 -110L20 138" stroke="#9db7d7" stroke-width="6" stroke-dasharray="9 10" />
      <path d="M-150 20C-150 85 130 150 210 20" fill="none" stroke="#c7a6ff" stroke-width="3" />
      <circle cx="20" cy="20" r="12" fill="url(#sun)" />
      <circle cx="20" cy="20" r="52" fill="none" stroke="#f6b95d" stroke-width="4" stroke-dasharray="12 8" />
      <circle cx="20" cy="20" r="88" fill="none" stroke="#2f9c8e" stroke-width="4" />
    </g>

    <g transform="translate(396 122)">
      <path d="M0 -24L14 -8H6V30H-6V-8H-14Z" fill="#173f67" />
      <circle cx="0" cy="20" r="14" fill="url(#sun)" />
      <path d="M28 12h30" stroke="#173f67" stroke-width="6" />
      <path d="M28 28h22" stroke="#173f67" stroke-width="6" />
      <text x="64" y="20" fill="#ebf3ff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Entrance A</text>
      <text x="64" y="38" fill="#ebf3ff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">(24.45312, 54.32681)</text>
    </g>

    <g transform="translate(300 38)">
      <rect width="140" height="58" rx="14" fill="url(#mint)" />
      <text x="17" y="26" fill="#0b3d39" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">precision band</text>
      <text x="17" y="44" fill="#0b3d39" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">5-decimal tolerance</text>
    </g>
  </g>

  <g transform="translate(360 318)" filter="url(#shadow)">
    <rect width="536" height="146" rx="24" fill="url(#paper)" />
    <rect x="18" y="16" width="500" height="40" rx="16" fill="url(#ink)" />
    <text x="34" y="42" fill="#ffd57e" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">PUBLISH OBJECTS ON ROUTE</text>
    <rect x="18" y="68" width="230" height="52" rx="16" fill="#f7fbff" />
    <text x="34" y="92" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">effective_window</text>
    <text x="34" y="108" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">version: 2026-08-30T07:00+04:00</text>
    <rect x="266" y="68" width="232" height="52" rx="16" fill="#f7fbff" />
    <text x="286" y="92" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">availability policy</text>
    <text x="286" y="108" fill="#204062" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">scope: channel distribution only</text>
    <line x1="262" y1="94" x2="290" y2="94" stroke="#d06f4f" stroke-width="4" />
    <line x1="262" y1="108" x2="290" y2="108" stroke="#d06f4f" stroke-width="4" />
  </g>

  <g transform="translate(74 316)" filter="url(#shadow)">
    <rect width="240" height="136" rx="22" fill="#0f3f62" />
    <rect x="16" y="14" width="124" height="28" rx="13" fill="url(#violet)" />
    <text x="32" y="33" fill="#eff3ff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">VERSION STAMP</text>
    <circle cx="120" cy="80" r="34" fill="url(#sun)" />
    <text x="102" y="86" fill="#4b2f0f" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">v2.1</text>
    <text x="16" y="116" fill="#ecf4ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">coord_policy: strict-5dp</text>
  </g>

  <g transform="translate(74 456)" filter="url(#shadow)">
    <rect width="190" height="52" rx="16" fill="#1f5a7e" />
    <text x="18" y="23" fill="#f6dd99" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800">audit trail</text>
    <text x="18" y="40" fill="#ecf6ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">origin_file + route_manifest_id</text>
  </g>

  <path d="M340 204C370 204 406 204 438 204" stroke="#6dd0c4" stroke-width="6" fill="none" />
  <path d="M800 204C840 204 860 204 880 204" stroke="#f5bc59" stroke-width="6" fill="none" />
  <path d="M438 204C470 204 470 290 540 290" stroke="#8a6ad9" stroke-width="6" fill="none" />
  <path d="M360 390C390 390 390 332 450 332" stroke="#2f9c8e" stroke-width="5" fill="none" />
  <path d="M640 390C676 390 676 332 612 332" stroke="#ffbf57" stroke-width="5" fill="none" />

  <circle cx="540" cy="332" r="7" fill="#f7ce66" />
</svg>
