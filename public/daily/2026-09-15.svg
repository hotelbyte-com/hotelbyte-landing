<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A gate that lets eight supplier requests through at a time</title>
  <desc id="desc">Queued request blocks on the left, a gate with eight lanes in the middle, and result cards flowing out in batches on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <g fill="#C9A24B" stroke="#7E5D19" stroke-width="2">
    <rect x="80" y="150" width="34" height="26" rx="6"/><rect x="124" y="150" width="34" height="26" rx="6"/><rect x="168" y="150" width="34" height="26" rx="6"/><rect x="212" y="150" width="34" height="26" rx="6"/>
    <rect x="80" y="190" width="34" height="26" rx="6"/><rect x="124" y="190" width="34" height="26" rx="6"/><rect x="168" y="190" width="34" height="26" rx="6"/><rect x="212" y="190" width="34" height="26" rx="6"/>
    <rect x="80" y="230" width="34" height="26" rx="6"/><rect x="124" y="230" width="34" height="26" rx="6"/><rect x="168" y="230" width="34" height="26" rx="6"/><rect x="212" y="230" width="34" height="26" rx="6"/>
    <rect x="80" y="270" width="34" height="26" rx="6"/><rect x="124" y="270" width="34" height="26" rx="6"/><rect x="168" y="270" width="34" height="26" rx="6"/><rect x="212" y="270" width="34" height="26" rx="6"/>
    <rect x="80" y="310" width="34" height="26" rx="6"/><rect x="124" y="310" width="34" height="26" rx="6"/><rect x="168" y="310" width="34" height="26" rx="6"/><rect x="212" y="310" width="34" height="26" rx="6"/>
    <rect x="80" y="350" width="34" height="26" rx="6"/><rect x="124" y="350" width="34" height="26" rx="6"/><rect x="168" y="350" width="34" height="26" rx="6"/>
  </g>
  <text x="163" y="430" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">requests</text>

  <path d="M262 263 H330" stroke="#1C2823" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="350" y="120" width="40" height="300" rx="8" fill="#1C2823"/>
  <rect x="570" y="120" width="40" height="300" rx="8" fill="#1C2823"/>
  <rect x="340" y="96" width="280" height="30" rx="8" fill="#9C3B25"/>
  <g stroke="#7E5D19" stroke-width="6" stroke-linecap="round">
    <path d="M398 162 H562"/><path d="M398 194 H562"/><path d="M398 226 H562"/><path d="M398 258 H562"/>
    <path d="M398 290 H562"/><path d="M398 322 H562"/><path d="M398 354 H562"/><path d="M398 386 H562"/>
  </g>
  <g fill="#D96C4F">
    <circle cx="470" cy="162" r="9"/><circle cx="510" cy="194" r="9"/><circle cx="440" cy="226" r="9"/><circle cx="530" cy="258" r="9"/>
    <circle cx="460" cy="290" r="9"/><circle cx="500" cy="322" r="9"/><circle cx="425" cy="354" r="9"/><circle cx="545" cy="386" r="9"/>
  </g>
  <text x="480" y="468" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">8 at a time</text>

  <path d="M626 263 H690" stroke="#1C2823" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g stroke="#4F7A6A" stroke-width="2">
    <rect x="712" y="150" width="160" height="56" rx="10" fill="#F8F5EC"/>
    <rect x="712" y="222" width="160" height="56" rx="10" fill="#F8F5EC"/>
    <rect x="712" y="294" width="160" height="56" rx="10" fill="#F8F5EC"/>
  </g>
  <g fill="#4F7A6A">
    <rect x="728" y="166" width="96" height="10" rx="5"/><rect x="728" y="184" width="64" height="8" rx="4"/>
    <rect x="728" y="238" width="96" height="10" rx="5"/><rect x="728" y="256" width="64" height="8" rx="4"/>
    <rect x="728" y="310" width="96" height="10" rx="5"/><rect x="728" y="328" width="64" height="8" rx="4"/>
  </g>
  <text x="792" y="430" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">results</text>
</svg>
