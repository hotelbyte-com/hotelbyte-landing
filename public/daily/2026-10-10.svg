<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">One calculation for the quote and the refund</title>
  <desc id="desc">A booking card with a tiered policy timeline feeds a calculation gear; two lines lead from the gear to matching quote and refund boxes.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#F2EEE2"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="#F8F5EC" stroke="#D8D1BD" stroke-width="2"/>

  <rect x="80" y="110" width="250" height="150" rx="14" fill="#F2EEE2" stroke="#1C2823" stroke-width="3"/>
