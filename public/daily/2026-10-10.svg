  <path d="M560 320 Q610 410 660 410" stroke="#1C2823" stroke-width="4" fill="none" marker-end="url(#tip)"/>

  <rect x="672" y="120" width="210" height="100" rx="14" fill="#F2EEE2" stroke="#1C2823" stroke-width="3"/>
