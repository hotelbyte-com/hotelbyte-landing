      <rect x="-14" y="54" width="28" height="30" rx="4" transform="rotate(45)"/>
      <rect x="-84" y="-14" width="30" height="28" rx="4" transform="rotate(45)"/>
      <rect x="54" y="-14" width="30" height="28" rx="4" transform="rotate(45)"/>
    </g>
