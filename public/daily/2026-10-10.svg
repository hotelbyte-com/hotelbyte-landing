  </g>
  <text x="205" y="420" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">policy</text>
  <path d="M205 260 V310" stroke="#1C2823" stroke-width="3" stroke-dasharray="6 6"/>

  <path d="M340 290 H410" stroke="#1C2823" stroke-width="4" marker-end="url(#tip)"/>
  <g transform="translate(490,290)">
    <circle r="62" fill="#7E5D19"/>
    <g fill="#7E5D19">
      <rect x="-14" y="-84" width="28" height="30" rx="4"/>
      <rect x="-14" y="54" width="28" height="30" rx="4"/>
