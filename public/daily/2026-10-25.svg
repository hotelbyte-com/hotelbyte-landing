<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A run stopped halfway, billed only for what was checked</title>
  <desc id="desc">A twelve-cell progress bar with six filled and six empty cells, a stop sign at the boundary, a coin stack under the filled half, and three status chips with the grey cancelled chip highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7E5D19"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <g fill="#C9A24B" stroke="#7E5D19" stroke-width="2">
    <rect x="120" y="150" width="54" height="56" rx="8"/><rect x="180" y="150" width="54" height="56" rx="8"/>
    <rect x="240" y="150" width="54" height="56" rx="8"/><rect x="300" y="150" width="54" height="56" rx="8"/>
    <rect x="360" y="150" width="54" height="56" rx="8"/><rect x="420" y="150" width="54" height="56" rx="8"/>
  </g>
  <g fill="none" stroke="#D8D1BD" stroke-width="3" stroke-dasharray="7 6">
    <rect x="486" y="150" width="54" height="56" rx="8"/><rect x="546" y="150" width="54" height="56" rx="8"/>
    <rect x="606" y="150" width="54" height="56" rx="8"/><rect x="666" y="150" width="54" height="56" rx="8"/>
    <rect x="726" y="150" width="54" height="56" rx="8"/><rect x="786" y="150" width="54" height="56" rx="8"/>
  </g>

  <path d="M480 128 V226" stroke="#9C3B25" stroke-width="4"/>
  <polygon points="466,62 494,62 514,82 514,110 494,130 466,130 446,110 446,82" fill="#9C3B25"/>
  <rect x="460" y="92" width="40" height="8" rx="4" fill="#F8F5EC"/>

  <path d="M297 214 V270" stroke="#7E5D19" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g fill="#C9A24B" stroke="#7E5D19" stroke-width="2">
    <ellipse cx="297" cy="336" rx="64" ry="16"/>
    <ellipse cx="297" cy="318" rx="64" ry="16"/>
    <ellipse cx="297" cy="300" rx="64" ry="16"/>
  </g>
  <text x="297" y="392" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">billed</text>

  <ellipse cx="663" cy="318" rx="64" ry="16" fill="none" stroke="#D8D1BD" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="663" y="392" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" fill-opacity="0.6" text-anchor="middle">not billed</text>

  <g stroke="#D8D1BD" stroke-width="2" fill="#F8F5EC">
    <rect x="130" y="418" width="200" height="54" rx="27"/>
    <rect x="650" y="418" width="200" height="54" rx="27"/>
  </g>
  <rect x="372" y="414" width="236" height="62" rx="31" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <circle cx="160" cy="445" r="11" fill="#4F7A6A"/><rect x="184" y="440" width="120" height="10" rx="5" fill="#4F7A6A" fill-opacity="0.45"/>
  <circle cx="680" cy="445" r="11" fill="#9C3B25"/><rect x="704" y="440" width="120" height="10" rx="5" fill="#9C3B25" fill-opacity="0.45"/>
  <circle cx="404" cy="445" r="12" fill="#1C2823" fill-opacity="0.45"/>
  <text x="428" y="455" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823">Cancelled</text>
</svg>
