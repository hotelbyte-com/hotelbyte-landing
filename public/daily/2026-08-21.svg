<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Blackout-date matrix keeps peak rules consistent</title>
  <desc id="desc">An editorial distribution artifact shows a contract appendix, blackout-date matrix, market pins, timezone boundary bar, rate-plan precedence board, channel gate card, approval stamp, and settlement connector line.</desc>
