      <stop offset="0" stop-color="#f4f8f0" />
      <stop offset="1" stop-color="#24344f" />
    </linearGradient>
    <linearGradient id="sheet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf3" />
      <stop offset="1" stop-color="#dbe3d4" />
