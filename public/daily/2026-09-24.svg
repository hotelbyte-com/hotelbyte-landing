<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Three order entry points, one revenue split that must balance</title>
  <desc id="desc">Three doors on the left send orders to one balance scale; the buyer price balances cost plus markup and built-in commission, above a ledger.</desc>
