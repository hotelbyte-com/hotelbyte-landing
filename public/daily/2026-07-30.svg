<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Refund batch ID tying settlement evidence together</title>
  <desc id="desc">An editorial settlement tabletop shows a refund batch ID tag connecting a settlement sheet, channel refund receipt, supplier offset note, finance voucher, bank-feed strip, fee-split chips, approval stamp, and colored evidence lines around the same money.</desc>
  <defs>
    <linearGradient id="table" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f0df"/>
      <stop offset="0.48" stop-color="#c8d8cc"/>
      <stop offset="1" stop-color="#253643"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#dce8dc"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#263743"/>
      <stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <linearGradient id="batch" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#d8933e"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f58a75"/>
      <stop offset="1" stop-color="#b84b55"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f3e9"/>
      <stop offset="1" stop-color="#5ba898"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c8e6ff"/>
      <stop offset="1" stop-color="#5485bc"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c6bcff"/>
      <stop offset="1" stop-color="#625c9f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1a2832" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#table)"/>
  <g opacity=".2" stroke="#ffffff" stroke-width="2">
    <path d="M86 96h790M86 156h790M86 216h790M86 276h790M86 336h790M86 396h790M86 456h790"/>
    <path d="M136 64v426M216 64v426M296 64v426M376 64v426M456 64v426M536 64v426M616 64v426M696 64v426M776 64v426M856 64v426"/>
  </g>
  <path d="M74 78h812M112 120h704M84 462h792" stroke="#fff9e8" stroke-width="8" stroke-linecap="round" opacity=".45"/>
  <path d="M96 400c116-34 236-30 364 12 140 46 278 24 404-64" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <rect x="78" y="356" width="806" height="104" rx="30" fill="#1e2c38" opacity=".13"/>

  <g transform="translate(88 92) rotate(-3)" filter="url(#shadow)">
    <rect width="392" height="316" rx="30" fill="url(#sheet)"/>
    <rect width="392" height="58" rx="30" fill="url(#ink)"/>
    <path d="M34 30h90M150 30h58M238 30h74" stroke="#ffe28a" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(34 88)">
      <path d="M0 0h326M0 44h326M0 88h326M0 132h326M0 176h326" stroke="#93a6a0" stroke-width="4" opacity=".68"/>
      <path d="M82-18v214M166-18v214M248-18v214" stroke="#93a6a0" stroke-width="4" opacity=".68"/>
      <rect x="166" y="-18" width="82" height="214" rx="16" fill="#fff2b6" opacity=".88"/>
      <path d="M22 22h40M104 22h42M184 22h42M268 22h34M22 66h40M104 66h42M184 66h42M268 66h34M22 110h40M104 110h42M184 110h42M268 110h34M22 154h40M104 154h42M184 154h42M268 154h34" stroke="#53635e" stroke-width="8" stroke-linecap="round"/>
      <rect x="176" y="52" width="62" height="32" rx="12" fill="url(#batch)"/>
      <rect x="176" y="96" width="62" height="32" rx="12" fill="url(#batch)"/>
      <path d="M188 68h30M188 112h30" stroke="#5b3f20" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="34" y="296" fill="#324755" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">settlement sheet</text>
  </g>

  <g transform="translate(408 166)" filter="url(#shadow)">
    <path d="M0 46c0-26 22-46 48-46h166c26 0 48 20 48 46v42c0 26-22 46-48 46H48c-26 0-48-20-48-46z" fill="url(#batch)"/>
    <circle cx="48" cy="67" r="18" fill="#fff8df"/>
    <path d="M82 48h88M82 76h118" stroke="#56391e" stroke-width="9" stroke-linecap="round"/>
    <text x="38" y="174" fill="#f9f1dd" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">refund batch ID</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M538 234C608 138 672 106 736 112" stroke="#f58a75" stroke-width="9"/>
    <path d="M530 254C624 250 692 252 774 288" stroke="#5ba898" stroke-width="9"/>
    <path d="M484 250C444 332 400 374 322 390" stroke="#5485bc" stroke-width="9"/>
    <path d="M452 218C386 182 326 164 252 172" stroke="#625c9f" stroke-width="9"/>
  </g>

  <g transform="translate(682 68)" filter="url(#shadow)">
    <rect width="194" height="126" rx="26" fill="#fffdf2"/>
    <rect x="24" y="24" width="68" height="42" rx="15" fill="url(#coral)"/>
    <path d="M36 45h44M112 34h46M112 62h30" stroke="#53645f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="152" cy="84" r="16" fill="url(#teal)"/>
    <text x="0" y="164" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">channel refund receipt</text>
  </g>

  <g transform="translate(690 266)" filter="url(#shadow)">
    <rect width="190" height="134" rx="28" fill="url(#teal)"/>
    <path d="M30 40h82M30 70h120M30 100h72" stroke="#25453f" stroke-width="8" stroke-linecap="round"/>
    <rect x="130" y="34" width="34" height="76" rx="13" fill="#fff8df"/>
    <path d="M140 60h14M140 84h14" stroke="#35665c" stroke-width="6" stroke-linecap="round"/>
    <text x="4" y="174" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">supplier offset note</text>
  </g>

  <g transform="translate(146 344)" filter="url(#shadow)">
    <rect width="224" height="112" rx="26" fill="url(#blue)"/>
    <path d="M28 34h84M28 64h132M28 92h92" stroke="#233c59" stroke-width="8" stroke-linecap="round"/>
    <rect x="164" y="30" width="36" height="58" rx="12" fill="#fffdf2"/>
    <path d="M174 50h16M174 68h16" stroke="#31587c" stroke-width="6" stroke-linecap="round"/>
    <text x="8" y="150" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">finance voucher</text>
  </g>

  <g transform="translate(112 116)" filter="url(#shadow)">
    <rect width="178" height="108" rx="25" fill="url(#violet)"/>
    <path d="M26 34h72M26 62h112M26 88h54" stroke="#fff8e8" stroke-width="8" stroke-linecap="round"/>
    <text x="2" y="146" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">bank-feed strip</text>
  </g>

  <g transform="translate(500 346)" filter="url(#shadow)">
    <rect width="214" height="96" rx="28" fill="#fffdf2"/>
    <circle cx="48" cy="48" r="24" fill="url(#coral)"/>
    <circle cx="108" cy="48" r="24" fill="url(#batch)"/>
    <circle cx="168" cy="48" r="24" fill="url(#teal)"/>
    <path d="M38 48h20M98 48h20M158 48h20" stroke="#fff8e8" stroke-width="7" stroke-linecap="round"/>
    <text x="8" y="134" fill="#f7f0dc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">fee split chips</text>
  </g>

  <g transform="translate(548 68)" filter="url(#shadow)">
    <circle cx="62" cy="62" r="54" fill="#fffdf2"/>
    <circle cx="62" cy="62" r="36" fill="none" stroke="url(#coral)" stroke-width="10"/>
    <path d="M42 62h40M62 42v40" stroke="#b84b55" stroke-width="8" stroke-linecap="round"/>
    <text x="2" y="154" fill="#334955" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">approval stamp</text>
  </g>
</svg>
