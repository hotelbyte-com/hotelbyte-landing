<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A save that reaches every cache layer</title>
  <desc id="desc">A save button sends a signal through four stacked cache layers, each checked off, until the new item appears in a dropdown list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7E5D19"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <rect x="56" y="222" width="168" height="72" rx="14" fill="#1C2823"/>
  <text x="140" y="268" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#F2EEE2" text-anchor="middle">save</text>

  <path d="M232 258 C276 258 276 132 316 132" fill="none" stroke="#7E5D19" stroke-width="5" marker-end="url(#tip)"/>

  <g stroke="#1C2823" stroke-width="2">
    <path d="M330 104 H590 L620 128 V150 H360 L330 126 Z" fill="#F8F5EC"/>
    <path d="M330 184 H590 L620 208 V230 H360 L330 206 Z" fill="#F2EEE2"/>
    <path d="M330 264 H590 L620 288 V310 H360 L330 286 Z" fill="#F8F5EC"/>
    <path d="M330 344 H590 L620 368 V390 H360 L330 366 Z" fill="#F2EEE2"/>
  </g>
  <g fill="#D8D1BD">
    <rect x="380" y="120" width="120" height="12" rx="6"/><rect x="380" y="200" width="96" height="12" rx="6"/>
    <rect x="380" y="280" width="132" height="12" rx="6"/><rect x="380" y="360" width="108" height="12" rx="6"/>
  </g>
  <path d="M540 150 V184 M540 230 V264 M540 310 V344" stroke="#7E5D19" stroke-width="5" stroke-dasharray="6 6"/>
  <g fill="#4F7A6A">
    <circle cx="562" cy="128" r="15"/><circle cx="562" cy="208" r="15"/><circle cx="562" cy="288" r="15"/><circle cx="562" cy="368" r="15"/>
  </g>
  <g fill="none" stroke="#F8F5EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M554 128 L560 134 L571 122"/><path d="M554 208 L560 214 L571 202"/>
    <path d="M554 288 L560 294 L571 282"/><path d="M554 368 L560 374 L571 362"/>
  </g>
  <text x="475" y="448" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">every layer</text>

  <path d="M626 380 C668 380 662 300 690 300" fill="none" stroke="#7E5D19" stroke-width="5" marker-end="url(#tip)"/>

  <rect x="700" y="112" width="210" height="300" rx="12" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <rect x="700" y="112" width="210" height="52" rx="12" fill="#1C2823"/>
  <path d="M868 132 L880 146 L892 132" fill="none" stroke="#F2EEE2" stroke-width="4" stroke-linecap="round"/>
  <g fill="#D8D1BD">
    <rect x="720" y="184" width="150" height="14" rx="7"/>
    <rect x="720" y="226" width="126" height="14" rx="7"/>
    <rect x="720" y="268" width="140" height="14" rx="7"/>
  </g>
  <rect x="712" y="304" width="186" height="44" rx="10" fill="#C9A24B" stroke="#7E5D19" stroke-width="2"/>
  <rect x="726" y="320" width="112" height="12" rx="6" fill="#1C2823"/>
  <circle cx="876" cy="326" r="8" fill="#9C3B25"/>
  <text x="805" y="470" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">shows up</text>
</svg>
