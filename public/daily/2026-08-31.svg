<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Distribution packet versions become auditable</title>
  <desc id="desc">An editorial asset scene with a supplier media package vault, version timeline, manifest cards, content-hash seals, channel scope chips, expiry clock, and audit trail links.</desc>
