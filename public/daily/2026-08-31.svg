      <stop offset="50%" stop-color="#122f44" />
      <stop offset="100%" stop-color="#1f1f3b" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fcf4" />
      <stop offset="100%" stop-color="#dbeaf0" />
