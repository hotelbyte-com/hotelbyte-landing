    <path d="M78 20v156" stroke="#fff8e4" stroke-width="7" stroke-linecap="round" opacity=".75"/>
    <circle cx="78" cy="92" r="22" fill="url(#coral)"/>
    <path d="M66 92h24" stroke="#fff8e4" stroke-width="7" stroke-linecap="round"/>
    <text x="-18" y="238" fill="#f8efdc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">market boundary gate</text>
  </g>

  <g transform="translate(116 424)" filter="url(#shadow)">
    <rect width="204" height="62" rx="24" fill="url(#violet)"/>
    <path d="M30 32h118" stroke="#fff8e4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="164" cy="31" r="14" fill="#fffdf3"/>
    <text x="2" y="98" fill="#f8efdc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">rate-plan ribbon</text>
