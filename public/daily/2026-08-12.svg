    <rect x="30" y="30" width="188" height="54" rx="20" fill="url(#chip)"/>
    <path d="M54 58h136" stroke="#103e37" stroke-width="9" stroke-linecap="round"/>
    <rect x="32" y="114" width="92" height="42" rx="17" fill="#d9e0dc"/>
    <path d="M52 135h52" stroke="#6d7875" stroke-width="7" stroke-linecap="round"/>
    <rect x="144" y="114" width="92" height="42" rx="17" fill="#d9e0dc"/>
    <path d="M164 135h52" stroke="#6d7875" stroke-width="7" stroke-linecap="round"/>
    <rect x="32" y="178" width="204" height="38" rx="16" fill="url(#discount)"/>
    <path d="M54 197h88M164 197h48" stroke="#4d3214" stroke-width="8" stroke-linecap="round"/>
    <text x="-8" y="304" fill="#334956" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">selected sub-channel chip</text>
  </g>

  <g transform="translate(604 356)" filter="url(#shadow)">
