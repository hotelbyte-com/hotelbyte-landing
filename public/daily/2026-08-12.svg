  <g transform="translate(360 410)" filter="url(#shadow)">
    <path d="M0 0h160l28 32-28 32H0z" fill="#fffdf3"/>
    <path d="M28 24h72M28 46h108" stroke="#5d6863" stroke-width="7" stroke-linecap="round"/>
    <circle cx="146" cy="32" r="13" fill="url(#discount)"/>
    <text x="-2" y="100" fill="#f8efdc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">budget-owner ticket</text>
  </g>

  <g transform="translate(502 284)" filter="url(#shadow)">
    <circle cx="54" cy="54" r="48" fill="#fffdf3"/>
    <path d="M54 24v30l22 14" stroke="#23384d" stroke-width="8" stroke-linecap="round"/>
    <path d="M26 54h12M70 54h12" stroke="#78d7b7" stroke-width="7" stroke-linecap="round"/>
    <circle cx="54" cy="54" r="34" fill="none" stroke="url(#discount)" stroke-width="9"/>
    <text x="-12" y="132" fill="#334956" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">expiry timer</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 218C548 176 584 160 636 140" stroke="#2d8b78" stroke-width="10"/>
    <path d="M488 164C548 118 582 100 632 96" stroke="#d58d31" stroke-width="8" stroke-dasharray="14 14"/>
    <path d="M470 302C526 342 562 374 626 400" stroke="#6558a4" stroke-width="8"/>
    <path d="M728 260C770 250 798 264 824 300" stroke="#b94452" stroke-width="9"/>
    <path d="M724 260l74 78" stroke="#fff8e4" stroke-width="14" opacity=".82"/>
    <path d="M302 424C358 398 420 370 504 338" stroke="#4d82ba" stroke-width="8" stroke-dasharray="12 14"/>
