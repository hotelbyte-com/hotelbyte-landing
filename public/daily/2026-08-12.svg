<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Promotion allowlist sub-channel chip drawing the discount edge</title>
  <desc id="desc">An editorial promotion control board shows a B2B_DEALS_APP sub-channel chip, grey candidate chips, 12 percent discount plate, market boundary gate, rate-plan ribbon, stacking-rule lock, budget-owner ticket, expiry timer, and a blocked affiliate distribution line.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset=".42" stop-color="#cfded8"/>
      <stop offset="1" stop-color="#27334a"/>
    </linearGradient>
    <linearGradient id="board" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf3"/>
      <stop offset="1" stop-color="#dfe8dc"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#23384d"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#78d7b7"/>
      <stop offset="1" stop-color="#2d8b78"/>
    </linearGradient>
    <linearGradient id="discount" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe275"/>
      <stop offset="1" stop-color="#d58d31"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f27a69"/>
      <stop offset="1" stop-color="#b94452"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#bfe8ff"/>
      <stop offset="1" stop-color="#4d82ba"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cec5ff"/>
      <stop offset="1" stop-color="#6558a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#172334" flood-opacity=".25"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#canvas)"/>
  <g opacity=".2" stroke="#ffffff" stroke-width="2">
    <path d="M78 78h804M78 126h804M78 174h804M78 222h804M78 270h804M78 318h804M78 366h804M78 414h804"/>
    <path d="M124 58v404M208 58v404M292 58v404M376 58v404M460 58v404M544 58v404M628 58v404M712 58v404M796 58v404"/>
  </g>
  <ellipse cx="506" cy="300" rx="414" ry="178" fill="#fff5d4" opacity=".18" filter="url(#glow)"/>
  <path d="M78 74h804M112 116h698M82 464h796" stroke="#fff8e4" stroke-width="8" stroke-linecap="round" opacity=".52"/>

  <g transform="translate(78 92)" filter="url(#shadow)">
