    <rect x="198" y="107" width="88" height="36" rx="15" fill="url(#discount)"/>
    <text x="218" y="132" fill="#4d3214" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">12%</text>
    <rect x="198" y="159" width="88" height="36" rx="15" fill="url(#blue)"/>
