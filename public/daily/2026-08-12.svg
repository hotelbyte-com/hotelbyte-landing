  <g transform="translate(278 58)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="24" fill="#fffdf3"/>
    <path d="M18 30h24M30 18v24" stroke="#b94452" stroke-width="7" stroke-linecap="round"/>
    <path d="M30 54v50" stroke="#b94452" stroke-width="7" stroke-linecap="round"/>
    <circle cx="30" cy="104" r="9" fill="#b94452"/>
    <text x="-18" y="144" fill="#334956" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">approval pin</text>
  </g>

  <text x="76" y="64" fill="#334956" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">one chip decides where the offer may travel</text>
  <text x="76" y="98" fill="#68766f" font-family="Inter, Arial, sans-serif" font-size="16">sub-channel, discount, market gate, rate plan, stacking lock, budget, expiry, blocked feed</text>
</svg>
