<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Amenity metadata keeps offers reproducible</title>
  <desc id="desc">An object-constellation scene showing amenity metadata as a reviewable row linked to locale labels, channel lanes, source hashes, validity windows, and evidence trays.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f5ff" />
      <stop offset="50%" stop-color="#f1eeff" />
      <stop offset="100%" stop-color="#5a4f9e" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecf4ff" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3555" />
      <stop offset="100%" stop-color="#12253c" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff0d1" />
      <stop offset="100%" stop-color="#4eb8d8" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd29f" />
      <stop offset="100%" stop-color="#f5a94b" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dab2ff" />
      <stop offset="100%" stop-color="#8f6ada" />
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#0f2234" flood-opacity="0.26" />
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)" />

  <g opacity="0.10" stroke="#9cb3d9" stroke-width="1.1">
    <path d="M0 86h960M0 172h960M0 258h960M0 344h960M0 430h960" />
    <path d="M98 0v540M212 0v540M326 0v540M440 0v540M554 0v540M668 0v540M782 0v540M896 0v540" />
  </g>

  <circle cx="120" cy="120" r="64" fill="#ff9e91" opacity="0.25" filter="url(#soft)" />
  <circle cx="870" cy="420" r="74" fill="#6ee0de" opacity="0.24" filter="url(#soft)" />

  <g transform="translate(70 70)" filter="url(#shadow)">
    <rect width="380" height="320" rx="28" fill="url(#paper)" stroke="#4f5f79" stroke-width="2" />
    <rect width="380" height="58" rx="28" fill="url(#ink)" />
    <text x="26" y="38" fill="#dce8ff" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="800">AMENITY METADATA ROW</text>

    <text x="26" y="90" fill="#18314f" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">amenity_tag_id</text>
    <rect x="24" y="98" width="332" height="30" rx="14" fill="url(#violet)" />
    <text x="39" y="118" fill="#271e44" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">A-8a7d · WIFI_DESK</text>

    <text x="26" y="152" fill="#18314f" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">label_version</text>
    <rect x="24" y="160" width="186" height="30" rx="14" fill="url(#mint)" />
    <text x="39" y="180" fill="#15374f" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">v2.1.3</text>

    <text x="230" y="152" fill="#18314f" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">source_hash</text>
    <rect x="228" y="160" width="128" height="30" rx="14" fill="#fff2e0" stroke="#a27d4a" stroke-width="1.2" />
    <text x="238" y="180" fill="#8b4d2d" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">9c4f...</text>

    <text x="26" y="220" fill="#18314f" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">effective_from</text>
    <text x="170" y="220" fill="#356b90" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">2026-09-13 00:00 GST</text>
    <text x="26" y="248" fill="#18314f" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">market_scope</text>
    <rect x="24" y="256" width="332" height="30" rx="14" fill="url(#amber)" />
    <text x="39" y="276" fill="#5e390a" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700">GLOBAL · EN / ZH / AR</text>

    <g transform="translate(24 298)">
      <rect width="130" height="24" rx="12" fill="#6cd9c4" />
      <text x="16" y="17" fill="#0c3f3a" font-size="12" font-family="Georgia, 'Times New Roman', serif" font-weight="700">source_file</text>
      <rect x="138" width="170" height="24" rx="12" fill="#f7d3ff" />
      <text x="154" y="17" fill="#3a1e5a" font-size="12" font-family="Georgia, 'Times New Roman', serif" font-weight="700">facility_pack_20260913.json</text>
      <rect x="316" width="58" height="24" rx="12" fill="#ffd18f" />
      <text x="328" y="17" fill="#4f2f00" font-size="12" font-family="Georgia, 'Times New Roman', serif" font-weight="700">LOCK</text>
    </g>
  </g>

  <g transform="translate(488 86)" filter="url(#shadow)">
    <rect width="356" height="320" rx="28" fill="url(#paper)" stroke="#4f5f79" stroke-width="2" />
    <rect width="356" height="58" rx="28" fill="url(#ink)" />
    <text x="20" y="36" fill="#dce8ff" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="800">CHANNEL VISIBILITY</text>

    <rect x="20" y="74" width="316" height="46" rx="15" fill="#edf2fb" />
    <text x="34" y="101" fill="#1f3853" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">B2B OTA · WIFI_DESK = enabled</text>

    <rect x="20" y="128" width="316" height="46" rx="15" fill="#fff0de" />
    <text x="34" y="155" fill="#7a4a16" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">B2C META · WIFI_DESK = enabled</text>

    <rect x="20" y="182" width="316" height="46" rx="15" fill="#f6e9ff" />
    <text x="34" y="209" fill="#4e2f7d" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">CORP ALIGNED · WIFI_DESK = disabled</text>

    <rect x="20" y="236" width="316" height="56" rx="15" fill="url(#amber)" />
    <text x="34" y="259" fill="#4e3006" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700">RESOLUTION</text>
    <text x="34" y="278" fill="#613806" font-family="Georgia, 'Times New Roman', serif" font-size="12">Resolve from same row only after hash approval</text>

    <rect x="20" y="302" width="316" height="28" rx="14" fill="#1f3d63" />
    <text x="36" y="320" fill="#e2edff" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">Audit lane: 3 channels, 1 object</text>
  </g>

  <g transform="translate(80 410)" fill="none" stroke="#31567a" stroke-width="2">
    <line x1="80" y1="70" x2="360" y2="-108" />
    <line x1="330" y1="70" x2="590" y2="-108" />
    <line x1="570" y1="70" x2="830" y2="-108" />
  </g>

  <g transform="translate(480 410)" filter="url(#shadow)">
    <rect x="0" y="-12" width="190" height="88" rx="22" fill="url(#paper)" stroke="#4f5f79" stroke-width="2" />
    <rect x="0" y="0" width="190" height="42" rx="21" fill="url(#ink)" />
    <text x="18" y="27" fill="#deebff" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="800">LOCALE LABELS</text>
    <text x="18" y="61" fill="#19395e" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">EN: Wi-Fi</text>
    <text x="18" y="77" fill="#19395e" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">ZH: 无线网络</text>
  </g>

  <g transform="translate(700 410)" filter="url(#shadow)">
    <rect x="0" y="-12" width="190" height="88" rx="22" fill="url(#paper)" stroke="#4f5f79" stroke-width="2" />
    <rect x="0" y="0" width="190" height="42" rx="21" fill="url(#ink)" />
    <text x="18" y="27" fill="#deebff" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="800">SETTLEMENT TRACE</text>
    <text x="18" y="61" fill="#19395e" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">proof_bucket: amenity-audit</text>
    <text x="18" y="77" fill="#19395e" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700">status: review-ready</text>
  </g>

  <g transform="translate(700 448)" fill="url(#mint)" opacity="0.9">
    <circle cx="16" cy="16" r="14" />
    <circle cx="0" cy="0" r="8" />
    <circle cx="24" cy="0" r="8" />
    <circle cx="8" cy="24" r="8" />
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#243d63" text-anchor="middle" opacity="0.65">
    <text x="480" y="526" font-size="16" font-weight="700">Centralized amenity object, unified promise, one audit lane</text>
  </g>
</svg>
