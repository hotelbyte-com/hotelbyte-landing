<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">One readiness check for the assistant and its entry</title>
  <desc id="desc">A check switch with two wires, one to the assistant and one to the portal entry button, which shows only as a dashed outline when the switch is off; the manual search box stays solid.</desc>
  <rect width="960" height="540" fill="#F2EEE2"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="#F8F5EC" stroke="#D8D1BD" stroke-width="2"/>

  <rect x="90" y="200" width="200" height="140" rx="18" fill="#1C2823"/>
  <rect x="122" y="244" width="136" height="52" rx="26" fill="#F2EEE2"/>
  <circle cx="152" cy="270" r="20" fill="#9C3B25"/>
  <text x="190" y="390" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">check</text>

  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M290 240 C380 240 380 140 470 140" stroke="#7E5D19"/>
    <path d="M290 300 C380 300 380 400 470 400" stroke="#7E5D19"/>
  </g>

  <g transform="translate(560,140)">
    <circle r="62" fill="#C9A24B" stroke="#7E5D19" stroke-width="4"/>
    <circle cx="-20" cy="-10" r="8" fill="#1C2823"/>
    <circle cx="20" cy="-10" r="8" fill="#1C2823"/>
    <path d="M-22 22 H22" stroke="#1C2823" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="730" y="152" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">assistant</text>

  <rect x="480" y="360" width="150" height="80" rx="40" fill="none" stroke="#9C3B25" stroke-width="4" stroke-dasharray="12 10"/>
  <rect x="660" y="360" width="220" height="80" rx="14" fill="#F2EEE2" stroke="#1C2823" stroke-width="4"/>
  <circle cx="704" cy="400" r="18" fill="none" stroke="#1C2823" stroke-width="5"/>
  <path d="M717 413 L732 428" stroke="#1C2823" stroke-width="6" stroke-linecap="round"/>
  <rect x="750" y="390" width="104" height="20" rx="8" fill="#D8D1BD"/>
  <text x="770" y="480" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">search</text>
</svg>
