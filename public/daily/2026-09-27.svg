<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Destination suggestions in two beats</title>
  <desc id="desc">A search box whose dropdown shows city pins in the first beat, then hotel cards pushed along a timeline as a complete replacement list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <rect x="60" y="50" width="400" height="64" rx="32" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <circle cx="106" cy="82" r="14" fill="none" stroke="#1C2823" stroke-width="4"/>
  <path d="M116 92l14 14" stroke="#1C2823" stroke-width="5" stroke-linecap="round"/>
  <rect x="146" y="74" width="120" height="16" rx="8" fill="#D8D1BD"/>
  <rect x="276" y="68" width="4" height="28" fill="#7E5D19"/>

  <rect x="60" y="130" width="400" height="190" rx="14" fill="#F8F5EC" stroke="#D8D1BD" stroke-width="3"/>
  <g fill="#9C3B25">
    <path d="M100 160a16 16 0 0 1 32 0c0 14 -16 30 -16 30s-16 -16 -16 -30z"/>
    <path d="M100 220a16 16 0 0 1 32 0c0 14 -16 30 -16 30s-16 -16 -16 -30z"/>
  </g>
  <rect x="150" y="156" width="150" height="16" rx="8" fill="#1C2823"/>
  <rect x="150" y="216" width="120" height="16" rx="8" fill="#1C2823"/>
  <path d="M100 280h300" stroke="#D8D1BD" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="300" y="232" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#9C3B25">cities</text>

  <path d="M60 420h820" stroke="#1C2823" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#1C2823">
    <circle cx="120" cy="420" r="9"/><circle cx="520" cy="420" r="9"/>
  </g>
  <text x="120" y="472" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">150 ms</text>
  <text x="520" y="472" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" text-anchor="middle">up to 3 s</text>

  <path d="M520 400 C520 330 540 300 580 280" fill="none" stroke="#4F7A6A" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <g transform="translate(590 120)">
    <rect width="300" height="230" rx="14" fill="#F8F5EC" stroke="#4F7A6A" stroke-width="4"/>
    <g fill="#4F7A6A">
      <rect x="20" y="22" width="56" height="44" rx="6"/><rect x="20" y="88" width="56" height="44" rx="6"/><rect x="20" y="154" width="56" height="44" rx="6"/>
    </g>
    <g fill="#7E5D19">
      <rect x="92" y="30" width="170" height="12" rx="6"/><rect x="92" y="96" width="140" height="12" rx="6"/><rect x="92" y="162" width="160" height="12" rx="6"/>
    </g>
    <g fill="#D8D1BD">
      <rect x="92" y="50" width="110" height="10" rx="5"/><rect x="92" y="116" width="90" height="10" rx="5"/><rect x="92" y="182" width="120" height="10" rx="5"/>
    </g>
  </g>
</svg>
