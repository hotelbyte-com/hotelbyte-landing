<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A risen price stopped before the booking is confirmed</title>
  <desc id="desc">A re-checked price column and a taller booking-time price column topped by a red rise; the arrow is stopped by a boom barrier and the confirmation stamp stays blank.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <path d="M90 404 H440" stroke="#1C2823" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="130" y="244" width="84" height="160" rx="8" fill="#C9A24B" stroke="#7E5D19" stroke-width="2"/>
  <path d="M214 244 H300" stroke="#7E5D19" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="300" y="244" width="84" height="160" rx="8" fill="#C9A24B" stroke="#7E5D19" stroke-width="2"/>
  <rect x="300" y="200" width="84" height="44" rx="8" fill="#D96C4F" stroke="#9C3B25" stroke-width="2"/>
  <path d="M342 186 V136 M326 152 L342 134 L358 152" stroke="#9C3B25" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="452" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">quoted</text>
  <text x="342" y="452" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">at booking</text>

  <path d="M400 300 H470" stroke="#1C2823" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="604" y="236" width="22" height="184" rx="6" fill="#1C2823"/>
  <rect x="484" y="288" width="128" height="26" rx="8" fill="#F8F5EC" stroke="#9C3B25" stroke-width="3"/>
  <g fill="#9C3B25">
    <rect x="496" y="291" width="18" height="20"/><rect x="532" y="291" width="18" height="20"/><rect x="568" y="291" width="18" height="20"/>
  </g>
  <text x="548" y="262" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#9C3B25" text-anchor="middle">refused</text>

  <path d="M646 300 H690" stroke="#1C2823" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="6 6"/>
  <circle cx="776" cy="300" r="70" fill="none" stroke="#4F7A6A" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="12 9"/>
  <path d="M744 302 L768 326 L812 278" stroke="#4F7A6A" stroke-opacity="0.3" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="776" y="414" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#1C2823" fill-opacity="0.45" text-anchor="middle">confirm</text>
</svg>
