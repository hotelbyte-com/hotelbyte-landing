<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A bridge from a Chinese keyword to an English-only hotel list</title>
  <desc id="desc">A search box with two block characters, a globe-shaped place index on top of an arched bridge, and a list card of English-only rows; the dashed direct line below is broken.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7E5D19"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <rect x="70" y="250" width="230" height="96" rx="16" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <g fill="none" stroke="#1C2823" stroke-width="5" stroke-linecap="round">
    <rect x="104" y="272" width="52" height="52" rx="4"/>
    <path d="M114 290H146M130 280V316M114 308H146"/>
    <rect x="176" y="272" width="52" height="52" rx="4"/>
    <path d="M186 284H218M202 284V316M188 300L216 316"/>
  </g>
  <circle cx="266" cy="298" r="13" fill="none" stroke="#7E5D19" stroke-width="4"/>
  <path d="M275 307L288 320" stroke="#7E5D19" stroke-width="5" stroke-linecap="round"/>
  <text x="185" y="392" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">keyword</text>

  <path d="M300 260C360 90 600 90 660 260" fill="none" stroke="#7E5D19" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M330 258C385 130 575 130 630 258" fill="none" stroke="#C9A24B" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <circle cx="480" cy="148" r="46" fill="#F8F5EC" stroke="#4F7A6A" stroke-width="5"/>
  <ellipse cx="480" cy="148" rx="20" ry="46" fill="none" stroke="#4F7A6A" stroke-width="3"/>
  <path d="M434 148H526M440 124H520M440 172H520" stroke="#4F7A6A" stroke-width="3"/>
  <text x="480" y="80" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">place index</text>

  <path d="M300 420H452M508 420H660" stroke="#9C3B25" stroke-width="4" stroke-dasharray="12 10"/>
  <path d="M468 404L492 436M492 404L468 436" stroke="#9C3B25" stroke-width="6" stroke-linecap="round"/>

  <rect x="660" y="200" width="230" height="190" rx="16" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <g fill="#1C2823" opacity="0.75">
    <rect x="684" y="224" width="150" height="12" rx="6"/>
    <rect x="684" y="256" width="120" height="12" rx="6"/>
    <rect x="684" y="320" width="140" height="12" rx="6"/>
    <rect x="684" y="352" width="110" height="12" rx="6"/>
  </g>
  <rect x="676" y="282" width="198" height="30" rx="8" fill="#D96C4F"/>
  <rect x="690" y="292" width="130" height="10" rx="5" fill="#F8F5EC"/>
  <text x="775" y="440" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">your list</text>
</svg>
