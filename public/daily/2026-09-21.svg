<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A messy sheet and a pasted table funnelled into tidy columns and batches</title>
  <desc id="desc">A tilted spreadsheet and a clipboard flow through a funnel into a neat table and a row of parcels submitted in batches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F2EEE2"/>
      <stop offset="1" stop-color="#F8F5EC"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1C2823"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>

  <g transform="rotate(-8 160 210)">
    <rect x="56" y="96" width="212" height="230" rx="10" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
