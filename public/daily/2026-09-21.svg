  <path d="M376 150 H568 L496 300 V352 H448 V300 Z" fill="#D8D1BD" stroke="#1C2823" stroke-width="3" stroke-linejoin="round"/>
  <text x="472" y="208" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">100 MB</text>
  <path d="M504 336 C562 336 566 212 604 204" fill="none" stroke="#1C2823" stroke-width="4" marker-end="url(#tip)"/>

  <rect x="616" y="96" width="290" height="190" rx="12" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <rect x="616" y="96" width="290" height="40" rx="12" fill="#1C2823"/>
  <rect x="616" y="120" width="290" height="16" fill="#1C2823"/>
