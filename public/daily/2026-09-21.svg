      <rect x="74" y="152" width="60" height="12" rx="6"/><rect x="146" y="152" width="100" height="12" rx="6"/>
      <rect x="74" y="182" width="110" height="12" rx="6"/><rect x="196" y="182" width="50" height="12" rx="6"/>
      <rect x="74" y="212" width="72" height="12" rx="6"/><rect x="158" y="212" width="88" height="12" rx="6"/>
    </g>
    <rect x="74" y="242" width="54" height="14" rx="4" fill="#D96C4F"/>
    <rect x="140" y="242" width="106" height="14" rx="4" fill="#C9A24B"/>
    <path d="M110 270 V310 M170 270 V310 M226 270 V310" stroke="#7E5D19" stroke-width="3"/>
  </g>
  <rect x="150" y="300" width="150" height="150" rx="10" fill="#F2EEE2" stroke="#1C2823" stroke-width="3"/>
  <rect x="192" y="288" width="66" height="26" rx="6" fill="#7E5D19"/>
  <g fill="#4F7A6A"><rect x="168" y="336" width="110" height="10" rx="5"/><rect x="168" y="362" width="84" height="10" rx="5"/><rect x="168" y="388" width="100" height="10" rx="5"/></g>
  <text x="170" y="500" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">as it is</text>

