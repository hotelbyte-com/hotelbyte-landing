<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Supplier rate-sheet currency column setting money paths</title>
  <desc id="desc">An editorial still life shows a tilted supplier rate sheet with an enlarged Currency column, AED USD and EUR trays, exchange-rate stamp, rounding caliper, tax tag, settlement ledger, and colored paths separating quote, display, charge, and settlement money.</desc>
  <defs>
    <linearGradient id="tabletop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.48" stop-color="#c9ded6"/>
      <stop offset="1" stop-color="#37445e"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#dfeadd"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#26364f"/>
      <stop offset="1" stop-color="#111b2b"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f3e8"/>
      <stop offset="1" stop-color="#63aa9b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d9963d"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f48b75"/>
      <stop offset="1" stop-color="#b64f5a"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9f95d6"/>
      <stop offset="1" stop-color="#4f4b83"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#203044" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#tabletop)"/>
  <path d="M74 76h812M112 118h704M80 462h800" stroke="#fff8e8" stroke-width="8" stroke-linecap="round" opacity=".42"/>
  <path d="M92 398c120-28 238-24 354 12 142 44 280 24 416-58" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <rect x="78" y="350" width="806" height="108" rx="30" fill="#283247" opacity=".12"/>

  <g transform="translate(104 88) rotate(-4)" filter="url(#shadow)">
    <rect width="430" height="338" rx="30" fill="url(#sheet)"/>
    <rect x="0" y="0" width="430" height="58" rx="30" fill="url(#ink)"/>
    <path d="M34 30h82M144 30h54M226 30h72M326 30h48" stroke="#ffe08a" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(34 86)">
      <path d="M0 0h362M0 46h362M0 92h362M0 138h362M0 184h362" stroke="#9eb0ac" stroke-width="4" opacity=".72"/>
      <path d="M74-18v222M166-18v222M256-18v222" stroke="#9eb0ac" stroke-width="4" opacity=".72"/>
      <rect x="166" y="-18" width="90" height="222" rx="16" fill="#d9f3e8" opacity=".82"/>
      <path d="M24 24h36M96 24h42M184 24h44M278 24h48M24 70h36M96 70h42M184 70h44M278 70h48M24 116h36M96 116h42M184 116h44M278 116h48M24 162h36M96 162h42M184 162h44M278 162h48" stroke="#52625f" stroke-width="8" stroke-linecap="round"/>
      <rect x="176" y="54" width="70" height="34" rx="13" fill="url(#amber)"/>
      <rect x="176" y="100" width="70" height="34" rx="13" fill="url(#coral)"/>
      <rect x="176" y="146" width="70" height="34" rx="13" fill="url(#plum)"/>
      <text x="190" y="78" fill="#3e3021" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">AED</text>
      <text x="190" y="124" fill="#fff8e8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">USD</text>
      <text x="190" y="170" fill="#fff8e8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">EUR</text>
    </g>
    <text x="34" y="318" fill="#384b56" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">supplier rate sheet</text>
  </g>

  <g transform="translate(580 70)" filter="url(#shadow)">
    <rect width="250" height="104" rx="28" fill="#fffdf2"/>
    <rect x="26" y="24" width="64" height="44" rx="16" fill="url(#amber)"/>
    <rect x="106" y="24" width="64" height="44" rx="16" fill="url(#coral)"/>
    <rect x="186" y="24" width="38" height="44" rx="16" fill="url(#plum)"/>
    <text x="38" y="53" fill="#3f3020" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">AED</text>
    <text x="118" y="53" fill="#fff8e8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">USD</text>
    <text x="194" y="53" fill="#fff8e8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">EUR</text>
    <text x="10" y="142" fill="#3e515a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">currency trays</text>
  </g>

  <g transform="translate(642 214)" filter="url(#shadow)">
    <rect width="228" height="138" rx="28" fill="url(#ink)"/>
    <path d="M30 42h84M30 72h132M30 102h96" stroke="#dff1e8" stroke-width="8" stroke-linecap="round"/>
    <rect x="164" y="34" width="42" height="70" rx="15" fill="url(#mint)"/>
    <path d="M176 58h18M176 80h18" stroke="#29434a" stroke-width="7" stroke-linecap="round"/>
    <text x="6" y="176" fill="#f5efe3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">settlement ledger</text>
  </g>

  <g transform="translate(538 354)" filter="url(#shadow)">
    <circle cx="54" cy="54" r="50" fill="url(#coral)"/>
    <circle cx="54" cy="54" r="32" fill="#fff8e8"/>
    <path d="M34 54h40M54 34v40" stroke="#b64f5a" stroke-width="8" stroke-linecap="round"/>
    <path d="M94 54c34 0 34 34 0 34" fill="none" stroke="#fff8e8" stroke-width="10" stroke-linecap="round"/>
    <text x="-20" y="128" fill="#f5efe3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">exchange-rate stamp</text>
  </g>

  <g transform="translate(768 368)" filter="url(#shadow)">
    <rect width="92" height="76" rx="22" fill="#fffdf2"/>
    <path d="M24 18v42M24 60h44M68 18v42" stroke="#26364f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 38h28" stroke="#d9963d" stroke-width="7" stroke-linecap="round"/>
    <text x="-26" y="114" fill="#f5efe3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">rounding caliper</text>
  </g>

  <g transform="translate(92 398)" filter="url(#shadow)">
    <rect width="164" height="70" rx="22" fill="#fffdf2"/>
    <path d="M26 28h58M26 50h94" stroke="#56615d" stroke-width="8" stroke-linecap="round"/>
    <rect x="112" y="18" width="30" height="32" rx="10" fill="url(#mint)"/>
    <text x="-2" y="108" fill="#f5efe3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">tax tag</text>
  </g>

  <g transform="translate(300 406)" filter="url(#shadow)">
    <rect width="166" height="64" rx="22" fill="url(#plum)"/>
    <path d="M24 24h50M92 24h44M24 44h96" stroke="#fff8e8" stroke-width="8" stroke-linecap="round"/>
    <text x="-4" y="102" fill="#f5efe3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">display currency card</text>
  </g>

  <path d="M454 184c78-38 130-58 188-62M514 258c68-8 110 6 142 42M420 330c58 54 102 84 140 88M286 394c38 20 78 34 120 42M254 344c-10 34-38 60-84 78" fill="none" stroke="#ffe08a" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 16" opacity=".9"/>
  <path d="M642 122l-32-8 12 30M656 300l-30-12 8 32M560 418l-30-10 12 30M406 436l-30-14 6 32M170 422l26-20 2 32" fill="none" stroke="#ffe08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <text x="76" y="64" fill="#26364f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">currency decides the money path</text>
  <text x="76" y="98" fill="#59666c" font-family="Inter, Arial, sans-serif" font-size="16">quote, display, charge, settlement, tax, exchange, rounding, exception trail</text>
</svg>
