<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Booking menus hidden in the portal while the API lane stays open</title>
  <desc id="desc">A portal window whose booking menus are rolled away behind a shutter, beside an open API lane that leads to an order box.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5EC"/>
      <stop offset="1" stop-color="#F2EEE2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4F7A6A"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="none" stroke="#D8D1BD" stroke-width="2"/>

  <rect x="90" y="100" width="300" height="300" rx="16" fill="#F8F5EC" stroke="#1C2823" stroke-width="3"/>
  <path d="M90 146 H390" stroke="#1C2823" stroke-width="3"/>
  <circle cx="116" cy="123" r="7" fill="#D96C4F"/><circle cx="140" cy="123" r="7" fill="#C9A24B"/><circle cx="164" cy="123" r="7" fill="#4F7A6A"/>
  <g fill="#D8D1BD">
    <rect x="116" y="170" width="200" height="26" rx="8"/>
    <rect x="116" y="212" width="160" height="26" rx="8"/>
    <rect x="116" y="254" width="180" height="26" rx="8"/>
  </g>
  <rect x="104" y="158" width="272" height="20" rx="10" fill="#7E5D19"/>
  <g fill="#C9A24B" stroke="#7E5D19" stroke-width="2">
    <rect x="110" y="178" width="260" height="22"/>
    <rect x="110" y="200" width="260" height="22"/>
    <rect x="110" y="222" width="260" height="22"/>
    <rect x="110" y="244" width="260" height="22"/>
    <rect x="110" y="266" width="260" height="22"/>
  </g>
  <rect x="116" y="312" width="248" height="22" rx="8" fill="#D8D1BD"/>
  <rect x="116" y="350" width="190" height="22" rx="8" fill="#D8D1BD"/>
  <text x="240" y="452" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">portal menus</text>

  <rect x="440" y="236" width="270" height="68" rx="34" fill="#4F7A6A"/>
  <path d="M470 270 H690" stroke="#F8F5EC" stroke-width="4" stroke-dasharray="14 12"/>
  <text x="575" y="222" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">API</text>
  <path d="M712 270 H758" stroke="#4F7A6A" stroke-width="8" fill="none" marker-end="url(#arrow)"/>

  <rect x="780" y="196" width="118" height="148" rx="12" fill="#C9A24B" stroke="#7E5D19" stroke-width="3"/>
  <path d="M780 232 H898" stroke="#7E5D19" stroke-width="3"/>
  <g fill="#F8F5EC" stroke="#7E5D19" stroke-width="2">
    <rect x="800" y="250" width="78" height="22" rx="4"/>
    <rect x="800" y="282" width="78" height="22" rx="4"/>
    <rect x="800" y="314" width="56" height="18" rx="4"/>
  </g>
  <text x="839" y="396" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#1C2823" text-anchor="middle">orders</text>
</svg>
