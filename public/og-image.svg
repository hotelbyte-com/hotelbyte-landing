<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="HotelByte — AI-Native hotel distribution infrastructure">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F2EEE2"/>

  <!-- Ledger rules -->
  <rect x="0" y="0" width="1200" height="6" fill="#1C2823"/>
  <rect x="0" y="14" width="1200" height="1" fill="#1C2823" opacity="0.25"/>

  <!-- Logo mark + wordmark -->
  <g transform="translate(96, 64)">
    <rect width="60" height="60" rx="6" fill="#1C2823"/>
    <text x="30" y="42" class="serif" font-size="27" fill="#F2EEE2" text-anchor="middle" letter-spacing="0.5">HB</text>
  </g>
  <text x="174" y="106" class="serif" font-size="42" fill="#1C2823" letter-spacing="1">HotelByte</text>

  <!-- Headline -->
  <text x="96" y="248" class="serif" font-size="68" fill="#1C2823" letter-spacing="0.5">AI-Native</text>
  <text x="96" y="330" class="serif" font-size="68" fill="#1C2823" letter-spacing="0.5">Engineering OS</text>
  <text x="96" y="398" class="serif" font-size="42" fill="#1C2823" opacity="0.55" letter-spacing="0.5">for Hotel Distribution</text>
  <rect x="96" y="430" width="112" height="3" fill="#7E5D19"/>

  <!-- Subline -->
  <text x="96" y="482" class="sans" font-size="21" fill="#1C2823" opacity="0.7">27+ supplier integrations · Price intelligence</text>
  <text x="96" y="512" class="sans" font-size="21" fill="#1C2823" opacity="0.7">Full-linkage diagnostics · AI revenue strategy</text>

  <!-- Domain plate -->
  <g transform="translate(96, 556)">
    <rect width="272" height="40" fill="none" stroke="#1C2823" stroke-opacity="0.25"/>
    <rect width="4" height="40" fill="#9C3B25"/>
    <text x="18" y="26" class="mono" font-size="17" fill="#7E5D19">hotelbyte.com</text>
  </g>

  <!-- Net rate sheet -->
  <g transform="translate(688, 132)">
    <rect width="416" height="322" fill="#F8F5EC" stroke="#1C2823" stroke-opacity="0.35"/>

    <text x="22" y="29" class="mono" font-size="13" fill="#1C2823" opacity="0.7" letter-spacing="2">NET RATE SHEET</text>
    <rect x="342" y="19" width="8" height="8" fill="#9C3B25"/>
    <text x="358" y="29" class="mono" font-size="13" fill="#9C3B25" letter-spacing="2">LIVE</text>
    <line x1="0" y1="46" x2="416" y2="46" stroke="#1C2823" stroke-opacity="0.35"/>

    <text x="22" y="72" class="mono" font-size="11" fill="#1C2823" opacity="0.45" letter-spacing="1.5">SUPPLIER</text>
    <text x="196" y="72" class="mono" font-size="11" fill="#1C2823" opacity="0.45" letter-spacing="1.5">ROOM</text>
    <text x="394" y="72" class="mono" font-size="11" fill="#1C2823" opacity="0.45" letter-spacing="1.5" text-anchor="end">NET</text>
    <line x1="0" y1="84" x2="416" y2="84" stroke="#D8D1BD"/>

    <text x="22" y="118" class="mono" font-size="14" fill="#1C2823" opacity="0.7">DIDA</text>
    <text x="196" y="118" class="mono" font-size="14" fill="#1C2823" opacity="0.7">Wan Chai</text>
    <text x="394" y="118" class="mono" font-size="14" fill="#1C2823" opacity="0.7" text-anchor="end">¥486</text>
    <line x1="0" y1="136" x2="416" y2="136" stroke="#D8D1BD"/>

    <text x="22" y="170" class="mono" font-size="14" fill="#1C2823" opacity="0.7">TOURMIND</text>
    <text x="196" y="170" class="mono" font-size="14" fill="#1C2823" opacity="0.7">Kowloon</text>
    <text x="394" y="170" class="mono" font-size="14" fill="#1C2823" opacity="0.7" text-anchor="end">¥312</text>
    <line x1="0" y1="188" x2="416" y2="188" stroke="#D8D1BD"/>

    <rect x="0" y="189" width="416" height="52" fill="#7E5D19" opacity="0.08"/>
    <text x="22" y="222" class="mono" font-size="14" fill="#1C2823" opacity="0.7">YALAGO</text>
    <text x="196" y="222" class="mono" font-size="14" fill="#1C2823" opacity="0.7">Kyoto</text>
    <text x="358" y="222" class="mono" font-size="14" fill="#7E5D19" font-weight="bold" text-anchor="end">¥998</text>
    <text x="394" y="222" class="mono" font-size="11" fill="#1C2823" opacity="0.45" text-anchor="end">−2.5%</text>
    <line x1="0" y1="241" x2="416" y2="241" stroke="#D8D1BD"/>

    <text x="22" y="275" class="mono" font-size="14" fill="#1C2823" opacity="0.7">HOTELBEDS</text>
    <text x="196" y="275" class="mono" font-size="14" fill="#1C2823" opacity="0.7">Osaka</text>
    <text x="394" y="275" class="mono" font-size="14" fill="#1C2823" opacity="0.7" text-anchor="end">¥655</text>

    <line x1="0" y1="290" x2="416" y2="290" stroke="#1C2823" stroke-opacity="0.35"/>
    <text x="22" y="312" class="mono" font-size="11" fill="#1C2823" opacity="0.45" letter-spacing="1.5">27+ SUPPLIERS · ONE API · UAT FEED</text>
  </g>

  <!-- Seal stamp -->
  <g transform="translate(688, 494)">
    <rect x="0" y="0" width="236" height="34" fill="none" stroke="#9C3B25" transform="rotate(-2 118 17)"/>
    <text x="16" y="22" class="mono" font-size="14" fill="#9C3B25" letter-spacing="1.5">B2B HOTEL DISTRIBUTION</text>
  </g>
</svg>
